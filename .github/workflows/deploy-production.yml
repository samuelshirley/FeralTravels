# Deploy to production.
#
# MERGING IS DEPLOYING. This workflow fires on every push to `main` — i.e. on
# every PR merge — applies pending migrations to the PROD database, then builds
# and deploys that commit to production via the Vercel CLI. There is no button
# to press and no second step. Because vercel.json disables Vercel's own git
# auto-deploy, this workflow is the ONLY path to production.
#
# The CI gate is ENFORCED, not a convention. Since a squash/merge commit has a
# different SHA than anything CI ever tested, the gate resolves the pull
# request this commit came from and requires the CI run for that PR's HEAD to
# be green. A direct push to `main` has no CI run and is therefore BLOCKED —
# push through a PR. Branch protection on main should require the CI checks
# anyway; this is the second lock on the same door.
#
# A CI run STILL GOING is waited for (up to 90 min), not failed. The required
# checks do not cover every CI job, so a merge can land while E2E is running —
# PR #79 did, one second after its `ai-tests` label started a fresh run, and
# deploy run 36856433646 refused it, leaving prod a merge behind (2026-10-01).
# While a deploy waits it holds the `deploy-production` concurrency group, so a
# later merge's deploy queues behind it; GitHub keeps only one pending run and
# cancels the older, which mobile.yml accepts when a later deploy covers it.
#
# WHY THIS IS SAFE ENOUGH TO BE AUTOMATIC: the PR already ran the full suite
# against a Vercel preview backed by a fresh clone of the prod DB, migrations
# included — so the merge itself is the decision point. The residual risk this
# does NOT cover: if the migration step below succeeds and the deploy step then
# fails, prod runs OLD code against a NEW schema until you fix forward. Keep
# migrations additive (add column/table, backfill, switch code, drop later) and
# that window is harmless. Also: "require branches to be up to date before
# merging" in branch protection is what stops a PR tested against a stale main
# from shipping.
#
# ROLLBACK: open a revert PR — it goes through the same gate and redeploys on
# merge. For an instant fix, re-promote the previous production deployment from
# the Vercel dashboard; note that neither undoes a migration, which is the
# other reason to keep them additive.
#
# REQUIRED REPO SECRETS:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DATABASE_URL   (the PROD Neon connection string — used only to migrate prod)

name: Deploy to production

on:
  push:
    branches: [main]
  # Ship the CURRENT main again, on demand, with no code change.
  #
  # Needed because production deploys are PREBUILT (`vercel build --prod` then
  # `vercel deploy --prebuilt --prod`), and Vercel refuses to redeploy a
  # prebuilt deployment from the dashboard — correctly: the bundle was compiled
  # against the environment as it stood at build time, so redeploying it would
  # quietly ship stale values. Which means changing an environment variable in
  # Vercel does NOTHING to production until something builds again. Without this
  # trigger the only way to apply one was to push a commit to main, so turning
  # `PAYWALL_ENABLED` on required inventing a change to make.
  #
  # Actions → Deploy to production → Run workflow. Same gate as a merge: it
  # re-verifies CI was green for the commit before it migrates or deploys.
  workflow_dispatch:

# Never two deploys at once, and never cancel one mid-migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  deploy:
    name: Migrate prod + deploy to production
    runs-on: ubuntu-latest
    # The CI gate may wait up to 90 min (its WAIT_SECONDS), then migrate +
    # build + deploy take up to the 20 this job had before the gate waited.
    # mobile.yml's deploy wait is sized from this number.
    timeout-minutes: 110
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # HARD GATE: refuse to deploy code that CI hasn't proven green.
      #
      # CI runs on pull_request, so its runs are keyed to the PR's HEAD sha,
      # not to the merge/squash commit sitting on main. Resolve the PR that
      # produced this commit, take its head sha, and require the latest CI run
      # for THAT sha to be completed + successful. If the commit has its own CI
      # run (e.g. deploying a PR head directly), that counts too.
      #
      # A run still going is WAITED FOR, not failed: polled every POLL_SECONDS,
      # re-reading the LATEST run each time (so a newer run for the sha — a
      # label run, a re-run — supersedes the one we started on), up to
      # WAIT_SECONDS. CI took 22–77 min over the last 30 green runs, so the
      # ceiling is 90. Then success deploys; any other conclusion, or the
      # ceiling, fails. No run at all fails at once (open a PR).
      #
      # Why it waits (2026-10-01): PR #79 got the `ai-tests` label at 11:36:30
      # and was merged at 11:36:31. The label started a new CI run on the same
      # head; this gate read it as in_progress and exited 1 three seconds later
      # (run 36856433646), so production stayed on PR #77.
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_SECONDS: '5400'
          POLL_SECONDS: '30'
          LOG_EVERY_SECONDS: '300'
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Deploying commit: $SHA"

          ci_state() {
            gh run list -R "$GITHUB_REPOSITORY" --workflow 'CI' --commit "$1" \
              --limit 1 --json status,conclusion \
              --jq 'if length == 0 then "none" else (.[0].status + "/" + (.[0].conclusion // "pending")) end'
          }

          RECOVER="Production was NOT updated. Once CI is green for this commit, re-run this deploy: Actions → Deploy to production → Re-run, or \`gh run rerun $GITHUB_RUN_ID\`."

          # 1. Did this exact commit get a CI run? (unusual on main, but honour it)
          TESTED_SHA="$SHA"
          STATE="$(ci_state "$SHA")"

          # 2. Otherwise walk back to the PR this commit came from.
          if [ "$STATE" = "none" ]; then
            PR_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.state == "closed" or .state == "open")][0].head.sha // empty' 2>/dev/null || true)"
            if [ -n "$PR_HEAD" ]; then
              TESTED_SHA="$PR_HEAD"
              STATE="$(ci_state "$PR_HEAD")"
              echo "Commit came from PR head: $PR_HEAD"
            fi
          fi

          if [ "$STATE" = "none" ]; then
            echo "::error::No CI run exists for $SHA nor for the head of a pull request it came from. $RECOVER Merge through a pull request; a direct push to main is never deployed."
            exit 1
          fi

          # 3. Still running: wait for it, re-reading the latest run each time.
          START="$(date +%s)"
          LAST_LOG="$START"
          echo "Latest CI run for $TESTED_SHA: $STATE"
          while [ "${STATE%%/*}" != "completed" ]; do
            NOW="$(date +%s)"
            if [ $(( NOW - START )) -ge "$WAIT_SECONDS" ]; then
              echo "::error::Gave up after $(( NOW - START ))s waiting for CI on $TESTED_SHA (last state: $STATE); the ceiling is ${WAIT_SECONDS}s. $RECOVER"
              exit 1
            fi
            sleep "$POLL_SECONDS"
            if ! NEXT="$(ci_state "$TESTED_SHA")"; then NEXT="api-error"; fi
            NOW="$(date +%s)"
            if [ "$NEXT" != "$STATE" ] || [ $(( NOW - LAST_LOG )) -ge "$LOG_EVERY_SECONDS" ]; then
              echo "CI for $TESTED_SHA after $(( NOW - START ))s: $NEXT"
              LAST_LOG="$NOW"
            fi
            STATE="$NEXT"
          done

          if [ "$STATE" != "completed/success" ]; then
            echo "::error::CI for $TESTED_SHA concluded ${STATE#completed/}, not success. $RECOVER"
            exit 1
          fi
          echo "CI green for $TESTED_SHA — deploying." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Apply pending migrations to PROD before the new code serves. Idempotent;
      # run-migrations advances the journal so already-applied ones are skipped.
      # These exact migrations already ran against a clone of this database in
      # the PR's CI run.
      - name: Apply migrations to production DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Pull production project settings + env, build against them, deploy to prod.
      - name: Build + deploy to production
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          URL="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "## 🚀 Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # Prod schema is now ahead of prod code — the exact failure mode from the
      # earlier outage. Make it loud instead of silent.
      - name: Warn if the deploy failed after migrating
        if: failure()
        run: |
          echo "::error::Deploy failed. If 'Apply migrations to production DB' succeeded and the deploy did not, PRODUCTION IS RUNNING OLD CODE AGAINST A NEW SCHEMA. Re-run this workflow, or merge a revert PR immediately."
