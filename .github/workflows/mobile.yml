# Mobile release pipeline.
#
# A merge to main that touches mobile/ does exactly ONE of these:
#
#   1. `eas update`  — publishes the JS bundle over the air. Testers on an
#                      installed build get it on next launch, in seconds.
#                      Free, instant, no queue.
#   2. `eas build`   — cuts a native binary and submits it to TestFlight.
#      + submit        ~30 minutes on the free plan's low-priority queue and
#                      one of 15 iOS build credits a month.
#
# WHICH ONE, and why it is an either/or again (2026-08-27).
#
# It was BOTH on every merge for two days, because before that a broken
# classifier picked the OTA for merges that had genuinely moved the native
# surface, and TestFlight silently went stale for a week. Building every
# time was the blunt fix for a rule that could not be trusted.
#
# The rule can be trusted now: it is a tested script rather than a regex,
# and it defaults to native on every failure path. So the build is back to
# being conditional, and a JS-only merge costs nothing.
#
# WHAT THE STALENESS RISK IS NOW, stated plainly rather than assumed away:
# an EXISTING tester is never stale — the OTA reaches their installed
# binary in seconds. A NEW tester installing fresh from TestFlight gets the
# binary's bundled JS until the app fetches the update on first launch, and
# an App Store submission always needs a current build. Before submitting,
# cut one by hand: Actions -> Mobile -> Run workflow.
#
# THE SAFETY PROPERTY, unchanged and the whole reason the classifier is
# careful. If a NATIVE input moved, the OTA is SKIPPED and only the binary
# ships. A bundle that expects a native module the installed binary does
# not carry crashes on launch, and runtimeVersion only protects against
# that when `version` is also bumped.
#
# WHAT COUNTS AS NATIVE. mobile/ios and mobile/android are gitignored (CNG —
# EAS regenerates them at build time), so they can never appear in a diff.
# The real native inputs are:
#
#   app.config.js      plugins, Info.plist, entitlements, bundle id, and
#                      `version`, which IS the runtimeVersion.
#   package.json       a new or removed native module changes the binary —
#                      but a scripts-only edit does not, so this one is
#                      judged by its CONTENT, not by its name. See
#                      scripts/decide-mobile-release.mjs.
#   package-lock.json  same, transitively. Unconditional on its own: it is
#                      the strongest evidence the dependency graph moved.
#   eas.json           build profile, channel, env baked into the bundle.
#   assets/**          icon and splash art are compiled in at prebuild.
#
# THE DECISION LIVES IN A SCRIPT, not in a regex in a `run:` block below.
# It used to match on file name alone, and a merge whose only change to
# mobile/package.json was a `scripts` entry (`sync:shared`, with the lockfile
# untouched — proof no dependency moved) was classified native: ~30 minutes of
# EAS queue, a build credit, and fifteen genuinely-JS files reaching nobody
# because this path deliberately skips the OTA. A regex in YAML cannot be
# tested, which is how it shipped. The rule is now
# scripts/decide-mobile-release.mjs and the spec is
# src/lib/decideMobileRelease.test.ts, which also fails if this file stops
# calling it.
#
# THIS JOB WAITS for the build and the submission — no --no-wait. A green
# run means the binary really is on App Store Connect, not merely queued.
# The cost is ~30-40 min of Actions time and one EAS build credit per
# qualifying merge. Switch to --no-wait if that ever hurts, but understand
# the trade: green would go back to meaning "queued", which is exactly what
# made the earlier failures invisible for a week.
#
# REQUIRED REPO SECRET:
#   EXPO_TOKEN  An access token belonging to the SAME Expo account that owns
#               the project — `owner` in app.config.js, currently
#               samuelashirley. A token from any other account, including a
#               robot user created under a different account, fails every
#               call with "Entity not authorized: AppEntity[...]". That is
#               what broke Mobile #1 and #2. Create it at
#               expo.dev -> account -> Access tokens.
#
# REQUIRED FOR THE UPLOAD:
#   An App Store Connect API key stored on EAS: `eas credentials` -> iOS ->
#   production -> App Store Connect API Key. eas.json pins ascAppId and
#   appleTeamId, but those are identifiers, not credentials. Without the key
#   --auto-submit fails AFTER a successful thirty-minute build.
#
# VERSIONS. buildNumber comes from EAS (appVersionSource: remote +
# autoIncrement in eas.json), so nothing is committed back to the repo.
# Bumping `version` in app.config.js starts a new TestFlight version group
# and a new OTA runtime in one move.

name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  # Same decision, run early and reported on the PR, so the cost of merging
  # is visible BEFORE the merge rather than in a run log afterwards.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ PR
  # Read-only. No EXPO_TOKEN, no eas-cli, no network beyond GitHub — it runs
  # the same classifier the merge will run and says what it found.
  forecast:
    name: What merging this will ship
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: mobile-forecast-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # MERGE-BASE, not base.sha. base.sha is the base branch's tip at
          # event time, so diffing against it attributes every commit main
          # gained since this PR branched to the PR itself — which would
          # forecast a native build for somebody else's dependency bump.
          if ! MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"; then
            echo "::warning::No merge base — assuming native."
            MERGE_BASE="$BASE"
          fi

          if ! node scripts/decide-mobile-release.mjs \
                 --base "$MERGE_BASE" --head "$HEAD" --json > forecast.json; then
            echo "::warning::decide-mobile-release.mjs failed to run — assuming native."
            echo '{"decision":"native","reasons":["the classifier could not run, so this defaults to a native build"]}' > forecast.json
          fi
          cat forecast.json

      - name: Say so on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const { decision, reasons } = JSON.parse(fs.readFileSync('forecast.json', 'utf8'));
            const sha = pr.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const marker = '<!-- feraltravels-mobile-release -->';

            const native = decision === 'native';
            const headline = native
              ? '### 📱 Merging this cuts a **native TestFlight build**'
              : '### 📱 Merging this publishes an **over-the-air update**';
            const cost = native
              ? 'About 30 minutes on the free plan\'s low-priority queue, and one of 15 iOS build credits this month. **The OTA is skipped** — a bundle that expects a native module the installed binary does not carry crashes on launch, so the binary is the only safe delivery here.'
              : 'Seconds, no queue, no build credit. Testers on an installed build get it on next launch. **No new TestFlight binary** — cut one by hand before an App Store submission (Actions → Mobile → Run workflow).';

            const body = [
              marker,
              headline,
              '',
              cost,
              '',
              '<details><summary>Why</summary>',
              '',
              ...reasons.map((r) => `- ${r}`),
              '',
              '</details>',
              '',
              `From \`${sha}\` · [run](${runUrl}) · rule: \`scripts/decide-mobile-release.mjs\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }

  # --------------------------------------------------------------- MERGE
  ship:
    name: OTA, or a TestFlight build when the native surface moved
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # Serialised rather than cancel-in-progress: a cancelled run can leave a
      # build running on EAS that nothing is tracking any more. Job-level so a
      # PR forecast never queues behind a thirty-minute release.
      group: mobile-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN repo secret is not set. See the header of this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # 22 is a FLOOR, not a preference. eas-cli pulls in
          # @oclif/plugin-autocomplete, which declares engines.node >=22.0.0,
          # so installing the CLI on Node 20 dies at resolve time with
          # "Found incompatible module" before a single Expo call is made.
          # Every other workflow in this repo is already on 22; this file was
          # the last one pinned to 20.
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        working-directory: mobile

      - name: Confirm the token can actually see this project
        working-directory: mobile
        run: |
          set -euo pipefail
          # Fail in seconds rather than after a thirty-minute build.
          # build:list is the cheapest call needing BOTH a valid token and
          # read access to THIS project — the exact pair that was missing
          # when a robot from another Expo account was wired in here.
          if ! eas build:list --platform ios --limit 1 --non-interactive --json > /dev/null 2>&1; then
            echo "::error::EXPO_TOKEN cannot read this project. It must belong to the Expo account named in app.config.js's 'owner'."
            exit 1
          fi
          echo "Token resolves the project."

      - id: native
        name: Did a native input move?
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A force-push, a first push, or a manual dispatch leaves no usable
          # base. Treat that as native: skipping the OTA is always safe, and
          # publishing a possibly-incompatible one is not.
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit — treating as native, OTA skipped."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The classifier prints one word on stdout and its reasoning on
          # stderr, which lands in this log. Every failure path inside it
          # already returns native; if it cannot run AT ALL, assume native
          # here too rather than letting an unset variable decide.
          if ! DECISION="$(node scripts/decide-mobile-release.mjs --base "$BEFORE" --head "$AFTER")"; then
            echo "::warning::decide-mobile-release.mjs failed to run — assuming native."
            DECISION=native
          fi

          case "$DECISION" in
            js-only)
              echo "JS only — safe to publish over the air as well."
              echo "native=false" >> "$GITHUB_OUTPUT"
              ;;
            native)
              echo "Native input moved — OTA skipped, binary only."
              echo "native=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Unrecognised classifier output '$DECISION' — assuming native."
              echo "native=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Load the production env from eas.json
        if: steps.native.outputs.native == 'false'
        working-directory: mobile
        # eas.json's build.production.env applies to BUILDS ONLY. `eas update`
        # bundles with whatever is in this shell, and EXPO_PUBLIC_* values are
        # inlined at bundle time — so without this step the update ships
        # lib/config.ts's fallbacks. API_BASE_URL survives (it defaults to
        # prod), but GOOGLE_IOS_CLIENT_ID collapses to null and
        # APPLE_SIGNIN_ENABLED to false: an OTA that silently deletes both
        # social sign-in buttons for every tester. Read out of eas.json rather
        # than restated here, so the two cannot drift.
        run: |
          node -e '
            const env = require("./eas.json").build.production.env || {};
            for (const [k, v] of Object.entries(env)) console.log(`${k}=${v}`);
          ' | tee -a "$GITHUB_ENV"

      - name: Publish the OTA
        id: ota
        if: steps.native.outputs.native == 'false'
        working-directory: mobile
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%s)"
          # --platform ios, NOT the default of "all". `eas update` runs
          # `expo export` under the hood, and with no `platforms` key in
          # app.config.js, Expo assumes web is in scope too. This project has
          # no react-native-web (the web app is the Next.js one, not Expo), so
          # an export for "all" dies on a missing dependency before it
          # bundles anything. iOS is the only platform with a binary out
          # there, so it is the only one worth publishing for.
          eas update --platform ios --channel production --non-interactive --message "${GITHUB_SHA:0:7} ${MSG}"

      - name: Build and submit to TestFlight
        id: build
        # THE GATE. Without this every mobile merge spends ~30 minutes and one
        # of 15 monthly iOS credits, including merges that only moved JS.
        # `native` is false only when the classifier could PROVE the change
        # cannot reach the binary; everything it cannot prove — and every way
        # it can fail — comes back true and builds.
        if: steps.native.outputs.native == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: mobile
        env:
          # We know this is not an Expo Go build; the warning is noise in logs
          # someone only reads when something has already gone wrong.
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit

      - name: Summary
        if: always()
        # Report what each step ACTUALLY did, not what the workflow set out to
        # do. An earlier version keyed the OTA line off the native check alone,
        # so run #4 announced "OTA: published" in the same breath as failing to
        # publish it. A summary that can lie is worse than no summary.
        env:
          OTA: ${{ steps.ota.outcome }}
          BUILD: ${{ steps.build.outcome }}
          NATIVE: ${{ steps.native.outputs.native }}
        run: |
          {
            echo "### Mobile"
            echo
            case "${OTA:-}" in
              success)
                echo "- **OTA:** published to channel \`production\` for iOS. Testers get it on next launch."
                ;;
              failure)
                echo "- **OTA:** **publish failed** — nothing went out over the air. See the step log."
                ;;
              skipped)
                if [ "${NATIVE:-}" = "true" ]; then
                  echo "- **OTA:** skipped — a native input moved, so a bundle could reach a binary that cannot run it."
                else
                  echo "- **OTA:** skipped."
                fi
                ;;
              *)
                echo "- **OTA:** not reached — the job failed before publishing."
                ;;
            esac
            case "${BUILD:-}" in
              success)
                echo "- **TestFlight:** built and submitted. Visible once Apple finishes processing, usually 5-15 minutes."
                ;;
              failure)
                echo "- **TestFlight:** **build or submit failed** — nothing was submitted. See the step log."
                ;;
              skipped)
                echo "- **TestFlight:** skipped — nothing that can reach the binary moved, so no build credit was spent. Existing testers get this over the air. Cut a binary by hand (Actions → Mobile → Run workflow) before an App Store submission."
                ;;
              *)
                echo "- **TestFlight:** not reached — the job failed before building."
                ;;
            esac
            echo
            echo "Builds: <https://expo.dev/accounts/samuelashirley/projects/feral-travels/builds>"
          } >> "$GITHUB_STEP_SUMMARY"
