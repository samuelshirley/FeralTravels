# Mobile release pipeline.
#
# EVERY merge to main that touches mobile/ does BOTH:
#
#   1. `eas update`  — publishes the JS bundle over the air. Testers on an
#                      installed build get it on next launch, in seconds.
#   2. `eas build`   — cuts a native binary and submits it to TestFlight, so
#      + submit        TestFlight always holds the newest code and is ready
#                      to promote to the App Store.
#
# These are not alternatives. The OTA is how a fix reaches a phone today;
# the binary is what Apple reviews and what ships. An earlier version of
# this file treated them as an either/or and picked the OTA for JS-only
# merges — which meant TestFlight silently went stale for a week while two
# PRs' worth of fixes existed only as bundles.
#
# THE ONE EXCEPTION, and it is a safety property rather than an
# optimisation. If a NATIVE input moved in this push, the OTA is SKIPPED.
# A bundle that expects a native module the installed binary does not carry
# crashes on launch, and runtimeVersion only protects against that when
# `version` is also bumped. On those merges the binary is the only safe
# delivery, so we build and say nothing went out over the air.
#
# WHAT COUNTS AS NATIVE. mobile/ios and mobile/android are gitignored (CNG —
# EAS regenerates them at build time), so they can never appear in a diff.
# The real native inputs are:
#
#   app.config.js      plugins, Info.plist, entitlements, bundle id, and
#                      `version`, which IS the runtimeVersion.
#   package.json       a new or removed native module changes the binary.
#   package-lock.json  same, transitively.
#   eas.json           build profile, channel, env baked into the bundle.
#   assets/**          icon and splash art are compiled in at prebuild.
#
# THIS JOB WAITS for the build and the submission — no --no-wait. A green
# run means the binary really is on App Store Connect, not merely queued.
# The cost is ~30-40 min of Actions time and one EAS build credit per
# qualifying merge. Switch to --no-wait if that ever hurts, but understand
# the trade: green would go back to meaning "queued", which is exactly what
# made the earlier failures invisible for a week.
#
# REQUIRED REPO SECRET:
#   EXPO_TOKEN  An access token belonging to the SAME Expo account that owns
#               the project — `owner` in app.config.js, currently
#               samuelashirley. A token from any other account, including a
#               robot user created under a different account, fails every
#               call with "Entity not authorized: AppEntity[...]". That is
#               what broke Mobile #1 and #2. Create it at
#               expo.dev -> account -> Access tokens.
#
# REQUIRED FOR THE UPLOAD:
#   An App Store Connect API key stored on EAS: `eas credentials` -> iOS ->
#   production -> App Store Connect API Key. eas.json pins ascAppId and
#   appleTeamId, but those are identifiers, not credentials. Without the key
#   --auto-submit fails AFTER a successful thirty-minute build.
#
# VERSIONS. buildNumber comes from EAS (appVersionSource: remote +
# autoIncrement in eas.json), so nothing is committed back to the repo.
# Bumping `version` in app.config.js starts a new TestFlight version group
# and a new OTA runtime in one move.

name: Mobile

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  # Serialised rather than cancel-in-progress: a cancelled run can leave a
  # build running on EAS that nothing is tracking any more.
  group: mobile-release
  cancel-in-progress: false

jobs:
  ship:
    name: OTA now, TestFlight build behind it
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN repo secret is not set. See the header of this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci
        working-directory: mobile

      - name: Confirm the token can actually see this project
        working-directory: mobile
        run: |
          set -euo pipefail
          # Fail in seconds rather than after a thirty-minute build.
          # build:list is the cheapest call needing BOTH a valid token and
          # read access to THIS project — the exact pair that was missing
          # when a robot from another Expo account was wired in here.
          if ! eas build:list --platform ios --limit 1 --non-interactive --json > /dev/null 2>&1; then
            echo "::error::EXPO_TOKEN cannot read this project. It must belong to the Expo account named in app.config.js's 'owner'."
            exit 1
          fi
          echo "Token resolves the project."

      - id: native
        name: Did a native input move?
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A force-push, a first push, or a manual dispatch leaves no usable
          # base. Treat that as native: skipping the OTA is always safe, and
          # publishing a possibly-incompatible one is not.
          if [ -z "${BEFORE:-}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "No usable base commit — treating as native, OTA skipped."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          NATIVE_RE='^mobile/(app\.config\.js|package\.json|package-lock\.json|eas\.json|assets/)'
          if echo "$CHANGED" | grep -Eq "$NATIVE_RE"; then
            echo "Native input touched — OTA skipped, binary only."
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "JS only — safe to publish over the air as well."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the production env from eas.json
        if: steps.native.outputs.native == 'false'
        working-directory: mobile
        # eas.json's build.production.env applies to BUILDS ONLY. `eas update`
        # bundles with whatever is in this shell, and EXPO_PUBLIC_* values are
        # inlined at bundle time — so without this step the update ships
        # lib/config.ts's fallbacks. API_BASE_URL survives (it defaults to
        # prod), but GOOGLE_IOS_CLIENT_ID collapses to null and
        # APPLE_SIGNIN_ENABLED to false: an OTA that silently deletes both
        # social sign-in buttons for every tester. Read out of eas.json rather
        # than restated here, so the two cannot drift.
        run: |
          node -e '
            const env = require("./eas.json").build.production.env || {};
            for (const [k, v] of Object.entries(env)) console.log(`${k}=${v}`);
          ' | tee -a "$GITHUB_ENV"

      - name: Publish the OTA
        if: steps.native.outputs.native == 'false'
        working-directory: mobile
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%s)"
          eas update --channel production --non-interactive --message "${GITHUB_SHA:0:7} ${MSG}"

      - name: Build and submit to TestFlight
        working-directory: mobile
        env:
          # We know this is not an Expo Go build; the warning is noise in logs
          # someone only reads when something has already gone wrong.
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          set -euo pipefail
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          NATIVE: ${{ steps.native.outputs.native }}
        run: |
          {
            echo "### Mobile"
            echo
            if [ "$NATIVE" = "false" ]; then
              echo "- **OTA:** published to channel \`production\`. Testers get it on next launch."
            else
              echo "- **OTA:** skipped — a native input moved, so a bundle could reach a binary that cannot run it."
            fi
            if [ "$STATUS" = "success" ]; then
              echo "- **TestFlight:** built and submitted. Visible once Apple finishes processing, usually 5-15 minutes."
            else
              echo "- **TestFlight:** **failed — nothing was submitted.** Check the step logs above."
            fi
            echo
            echo "Builds: <https://expo.dev/accounts/samuelashirley/projects/feral-travels/builds>"
          } >> "$GITHUB_STEP_SUMMARY"
