# CI — the PR gate. Runs on every push to a pull request targeting main.
#
# Flow:
#   1. unit    — vitest `unit` project: 43 pure-logic specs, node env, no jsdom.
#      ui      — vitest `ui` project: the React component specs under jsdom.
#                 unit and ui run CONCURRENTLY; both gate the preview.
#      mobile  — tsc --noEmit over mobile/. Runs alongside unit and does NOT
#                gate the preview (the preview is the web app; a broken Expo
#                type has nothing to say about it). It exists because the
#                Mobile workflow publishes mobile/ over the air on merge:
#                without this job the first thing to catch a type error in the
#                app is a tester's phone.
#   2. preview — create an EPHEMERAL Neon branch `preview/pr-<N>` (copy-on-write
#                clone of PROD data), run migrations on it, and deploy a Vercel
#                PREVIEW pointed at it. One preview per PR, refreshed on every
#                push, torn down when the PR closes (pr-cleanup.yml). Prod's DB
#                is never touched. The URL is posted as a sticky PR comment and
#                to the run summary. It deploys BEFORE the tests intentionally,
#                so you get a clickable preview even when a spec is red
#                (test bug vs app bug).
#   3. e2e     — full Playwright suite against that exact preview URL
#                (E2E_BASE_URL → playwright.config skips its local webServer),
#                then assert-e2e-ran.mjs fails the job if the suite mass-SKIPPED
#                (no mail path, misconfigured endpoint) — otherwise "green"
#                could mean
#                "tested nothing", which now auto-ships to prod on merge.
#
# These three are the checks you make REQUIRED in branch protection. MERGING IS
# DEPLOYING: a green PR merged to main triggers deploy-production.yml, which
# migrates prod and ships that commit with no human step — so this workflow is
# the only thing standing in front of prod.
#
# There is NO auth bypass anywhere: e2e signs in as fresh fixture users through
# the real OTP flow, reading the code the app generated from the guarded
# /api/test/otp endpoint — nothing is minted, nothing is granted. The /api/test/* endpoints only seed/reset
# fixture DATA, are hard-off on VERCEL_ENV=production, and on the public
# preview URL additionally require a per-run secret: both jobs derive the same
# HMAC(AUTH_SECRET, run id) — the preview app requires it in the
# x-e2e-test-secret header (E2E_TEST_ENDPOINTS_SECRET), the Playwright runner
# sends it. No extra repo secret to manage; it rotates every run.
#
# NOTE: preview deployments carry a clone of REAL production data on a public
# URL (Vercel Deployment Protection is off — the Hobby plan can't protect
# previews without also protecting prod). pr-cleanup.yml deletes the DB branch
# on PR close to bound the exposure window, and next.config.js sends
# X-Robots-Tag: noindex on every non-production deployment.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   NEON_API_KEY, NEON_PROJECT_ID   (from the Neon GitHub integration)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   AUTH_SECRET                     (also the HMAC key for the per-run test-endpoint secret)
#   AUTH_RESEND_KEY                 (runner-side copy of the app's Resend key —
#                                    lets login-otp read the inbound mailbox)
#   E2E_INBOX_DOMAIN                (the Resend receiving domain, e.g.
#                                    <id>.resend.app — gates login-otp, the ONE
#                                    spec that proves mail actually gets sent)
#   VERCEL_AUTOMATION_BYPASS_SECRET (optional — only if Vercel Deployment
#                                    Protection is enabled on the project)
# App runtime/build env (ANTHROPIC_API_KEY, AUTH_RESEND_KEY, AUTH_EMAIL_FROM,
# NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, …) comes from the Vercel project's PREVIEW
# environment via `vercel pull` — keep that env complete there, not here.
# NOTE: the prod DATABASE_URL secret is intentionally NOT used by this workflow.

name: CI

on:
  pull_request:
    branches: [main]
    # `labeled` is here for ONE label: `ai-tests`. See the decide job's
    # "Pick the iOS shards" step — the label adds the `ai` shard, the Maestro
    # flows that ask Penny to plan for real.
    #
    # WHY A LABEL AND NOT A COMMENT OR workflow_dispatch, which both read as
    # more natural ways to say "run them now": deploy-production.yml's gate
    # resolves the PR a merge commit came from and looks up
    # `gh run list --workflow CI --commit <that PR's head sha> --limit 1`.
    # Only a `pull_request` event produces a CI run keyed to the PR's head sha
    # — an `issue_comment` or `workflow_dispatch` run is keyed to the default
    # branch, so the gate would never find it and the label would run the tests
    # without making the PR mergeable. A label is also the only one of the three
    # that a re-run preserves: "Re-run all jobs" replays the `labeled` event,
    # so the `ai` shard runs again.
    #
    # `--limit 1` takes the LATEST run for the sha, so the label run supersedes
    # the push run it followed. The corollary, stated because it is the sharp
    # edge of this design: push again after labelling and the new commit's run
    # is a cheap one, green, and merge-able without Penny having been asked to
    # plan anything. The E2E PR comment says which kind of run it was.
    #
    # A label OTHER than `ai-tests` still triggers a full (cheap) run. That is
    # deliberate rather than filtered out: making unrelated labels skip every
    # job would produce a workflow run that GitHub concludes as `success`
    # having tested nothing, and the deploy gate would happily merge on it.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# One CI run per PR: a new push cancels the in-flight run (and its preview
# build) rather than racing it for the same Neon branch.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}

jobs:
  # Is this PR documentation only? The jobs that DEPLOY something or DRIVE a
  # browser are gated on the answer; see scripts/decide-docs-only.mjs for the
  # rule, the fail-safe direction, and why the workflow still runs at all.
  #
  # NOT a `paths-ignore` on the trigger, and that is the whole design: the
  # deploy gate in deploy-production.yml requires a CI run keyed to the PR's
  # head sha to be completed+success, and a filtered-out trigger produces NO
  # run for that sha — so a docs merge would leave production stale until
  # somebody re-ran the deploy by hand. A run whose expensive jobs SKIPPED
  # still concludes `success`, which is what the gate reads.
  decide:
    name: Decide scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      ios_shards: ${{ steps.shards.outputs.ios_shards }}
    steps:
      - uses: actions/checkout@v4

      # The iOS shards to run: one per mobile/maestro/shards/<name>.yaml, so a
      # new shard is a new file and nothing here changes. `ai` holds the flows
      # that ask Penny to plan for real (Anthropic spend, plus Directions and
      # Places), and joins ONLY on a run STARTED by the `ai-tests` label (see
      # the trigger for why a label).
      #
      # STARTED BY, not "the PR carries it": that would put the spend back on
      # every push made while the label sat there, which is the thing being
      # switched off. Remove and re-add the label, or "Re-run all jobs" on the
      # labelled run, to run it again.
      #
      # The label name goes through env, never `${{ }}` inside the shell — a
      # label is attacker-controllable text on a public repo, and interpolating
      # it into a script is a command-injection hole.
      #
      # Until 2026-09-27 the same gate chose two Playwright specs
      # (penny-plan-trip, chat-maps-link) in the E2E job; they are this shard's
      # two flows now, on the phone.
      - name: Pick the iOS shards
        id: shards
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" = "ai-tests" ]; then
            IOS_AI=1
          else
            IOS_AI=0
          fi
          SHARDS="$(IOS_AI="$IOS_AI" node -e "
            const fs = require('fs');
            const names = fs.readdirSync('mobile/maestro/shards')
              .filter((f) => f.endsWith('.yaml'))
              .map((f) => f.slice(0, -5))
              .filter((n) => n !== 'ai' || process.env.IOS_AI === '1')
              .sort();
            console.log(JSON.stringify(names));
          ")"
          echo "ios_shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "iOS shards: $SHARDS" >> "$GITHUB_STEP_SUMMARY"
      - name: Classify the diff
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # The API, not `git diff`: it needs no fetch depth and no merge-base
          # arithmetic. A failure here writes an EMPTY list, which the script
          # reads as "could not prove it" and answers false.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[].filename' > changed-files.txt || : > changed-files.txt
          node scripts/decide-docs-only.mjs --files changed-files.txt \
            >> "$GITHUB_OUTPUT" 2> reasons.txt || echo "docs_only=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Scope"
            echo '```'
            cat reasons.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ONE job for both vitest projects, because both ARE unit tests. The
  # project split (`unit` in node, `components` in jsdom) still exists — it
  # keeps logic specs from paying for a DOM they never touch — but it is a
  # vitest concern, not a CI one. Two boxes labelled "Unit tests" and "UI
  # tests" read as though one of them drove a browser; only the E2E job
  # does, and that ambiguity cost more than the ~20s of parallelism it
  # bought against a five-minute pipeline. Vitest still reports each
  # project separately, so a red component spec is no harder to spot.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # FIRST, before checkout: stamp the PREVIOUS E2E results comment as
      # superseded. That comment is sticky — edited in place — and GitHub keeps
      # an edited comment at its ORIGINAL position in the timeline, so last
      # commit's green table stays put while newer commits scroll past beneath
      # it, reading as though it covers them.
      #
      # This is a STEP and not a job on purpose. A job is a row in the PR checks
      # list, and that list is a dashboard you read at a glance — is this an OTA
      # or a native build, did the simulator pass. A row reporting on a COMMENT
      # says nothing about the code and would sit there on every PR forever.
      #
      # `unit` hosts it because it has no `needs:`, so it starts within seconds
      # of a push. That covers the case that matters: the pipeline never
      # reaching the E2E job at all (failed preview deploy, a run cancelled by
      # cancel-in-progress), where the `if: always()` results step never runs
      # and the stale green table would otherwise stand unchallenged.
      - name: Mark the previous E2E results superseded
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- feraltravels-e2e-results -->';
            const open = '<!-- stale-banner:start -->';
            const close = '<!-- stale-banner:end -->';
            const pr = context.payload.pull_request;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) return; // nothing to stale on the first run
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Idempotent: strip any banner a previous run left before adding ours.
            const stripped = existing.body.replace(
              new RegExp(`${open}[\\s\\S]*?${close}\\n*`), ''
            );
            const banner = [
              open,
              '> [!WARNING]',
              '> **Superseded — the table below is NOT for the latest commit.**',
              `> \`${pr.head.sha.slice(0, 7)}\` is [running now](${runUrl}). This comment is`,
              '> rewritten with its real results when that run finishes.',
              close,
            ].join('\n');
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: stripped.replace(marker, `${marker}\n${banner}`),
            });

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  # The mobile half of the gate. Deliberately typecheck-only for now: mobile/
  # has no test suite of its own, and the shared domain logic it depends on is
  # already covered by the unit project (including the mirror-drift guard in
  # src/lib/sharedMirror.test.ts). Type errors are the failure mode this
  # actually needs to stop, because an OTA update ships whatever compiles.
  mobile:
    name: Mobile typecheck
    # Skipped on a docs-only PR: no file under mobile/ changed, so there is no
    # Expo type for tsc to have an opinion about.
    needs: decide
    if: needs.decide.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # 15, not 10: two Metro bundles (the E12 check) ride along with tsc.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # mobile/ has its own lockfile — the root one would cache the wrong
          # tree and reinstall from scratch every run.
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      # Decision E12: a release build must not CONTAIN the purchase sheet's
      # developer diagnostics ("the App Store isn't offering these plans yet"
      # read by an App Review tester is a rejection). PurchaseSheet reaches
      # them only as `__DEV__ ? require(...) : null`, which Metro folds away in
      # a release bundle — this proves it on the actual artifact, both ways:
      # the dev bundle must carry the sentinel (so the grep can see it) and the
      # release bundle must not. The positive control on the customer copy
      # proves the release grep is reading a real bundle. Plain JS, not Hermes
      # bytecode, because Hermes stores non-ASCII strings as UTF-16.
      - name: Release bundle carries no purchase diagnostics
        working-directory: mobile
        env:
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: appl_ci_bundle_check
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bundles"; mkdir -p "$out"
          for dev in true false; do
            npx expo export:embed --platform ios --dev "$dev" --minify "$([ "$dev" = false ] && echo true || echo false)" \
              --entry-file node_modules/expo-router/entry.js \
              --bundle-output "$out/dev-$dev.js" --assets-dest "$out/assets-$dev"
          done
          grep -q PURCHASE_DIAGNOSTICS_DEV_ONLY "$out/dev-true.js" \
            || { echo "::error::dev bundle lacks the sentinel — the check below would prove nothing"; exit 1; }
          grep -q "Restore purchases will find it" "$out/dev-false.js" \
            || { echo "::error::release bundle lacks the customer copy — not a real bundle?"; exit 1; }
          if grep -q PURCHASE_DIAGNOSTICS_DEV_ONLY "$out/dev-false.js"; then
            echo "::error::the RELEASE bundle contains purchaseDiagnostics — see docs/decisions.md E12"
            exit 1
          fi

  # THE preview — tested by e2e below, clickable by humans from the PR comment.
  preview:
    name: Deploy tested preview
    # A docs-only PR skips the whole deployed half of this pipeline: no Neon
    # branch cloned from production, no Vercel preview, and — because `e2e` and
    # `ios-e2e` both `needs: preview` — no Playwright run and no simulator.
    #
    # `unit` is deliberately NOT gated. Markdown in this repo is not inert:
    # claudeMdGuard, decisionsRegisterGuard, removedFeaturesGuard,
    # googleAccountingGuard and oneGoogleKeyGuard all read CLAUDE.md or
    # docs/decisions.md as TEXT, so a docs-only PR is exactly the kind that
    # reds them.
    needs: [unit, decide]
    if: needs.decide.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      # The same build, deployed a second time with WEB_APP_ENABLED unset, so
      # the configuration production actually runs gets tested too.
      blocked_url: ${{ steps.deploy.outputs.blocked_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Recreate this PR's branch from prod on every push: drop the old one
      # (ignore if absent — first push), then re-create it so the preview shows
      # CURRENT prod data and none of the previous run's fixture junk. E2E seeds
      # its users into this branch over HTTP; prod is untouched.
      - name: Delete previous Neon branch for this PR
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}
      - name: Create fresh Neon branch from prod
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
      # This is also the migration rehearsal: a migration that fails here never
      # reaches the prod DB, because deploy-production.yml only runs after a
      # green CI.
      - name: Apply migrations to the PR branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:migrate

      # Turn paywall enforcement ON for the tested preview.
      #
      # It has to be on: e2e/subscriptions.spec.ts ages an account, plants spend
      # and writes a subscription row, then asserts the wall appears — and with
      # the switch off `applySwitch` hands every one of them full access. Six
      # enforcement specs fail, and the ones asserting the ABSENCE of a wall pass
      # for no reason at all, which is the worse half: they would keep passing
      # with the paywall completely broken.
      #
      # This used to be `-e PAYWALL_ENABLED="1"` on the deploy below. The switch
      # moved into `app_meta.paywall_enabled` on 2026-09-02 so that turning it
      # OFF stops needing a redeploy, and that silently disarmed the flag — the
      # `-e` was still there and nothing read it any more. This is the same
      # decision expressed against the thing that now holds it.
      #
      # A test-only env override in switch.ts would have been a smaller change.
      # It would also mean the suite exercised a path production does not use,
      # and would put back the second source of truth that moving the switch
      # removed. The suite tests what ships; what ships reads a row.
      #
      # BEFORE the deploy, so the 30s read cache in switch.ts is irrelevant —
      # the first read any instance makes already sees it. Both deployments
      # below share this Neon branch, so one write covers both.
      - name: Turn the paywall ON for the tested preview
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: node scripts/set-paywall-flag.mjs on

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deploy as a preview (no --prod). Build-time env (NEXT_PUBLIC_*) comes
      # from the project's preview environment via `vercel pull`; runtime env
      # is overridden per-deployment: DATABASE_URL → this PR's Neon branch,
      # plus the guarded fixture-data endpoints so E2E seeding works.
      - name: Deploy preview + print URL
        id: deploy
        env:
          HMAC_KEY: ${{ secrets.AUTH_SECRET }}
        run: |
          # NOTE: derived from run_id ONLY (no run_attempt) — "re-run failed
          # jobs" increments the attempt without redeploying the preview, so
          # including it would desync the runner from the deployed app.
          SECRET="$(printf 'test-endpoints-%s' "${{ github.run_id }}" | openssl dgst -sha256 -hmac "$HMAC_KEY" -r | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          # Fail HERE, before a build and a browser, if the preview environment
          # is short a variable. Vercel scopes each one per-environment and the
          # picker makes "Production" alone easy to choose by accident; the
          # symptom is then a red spec somewhere unrelated on whichever PR is
          # open, which reads as an app bug. `vercel pull` just wrote exactly
          # what `vercel build` will compile against, so that file is the thing
          # worth asserting on.
          node scripts/check-preview-env.mjs
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          # WEB_APP_ENABLED="1" is passed here, so this preview runs with the web
          # app ON. The web is OFF unless the variable is exactly "1"
          # (src/lib/webAccess.ts), so dropping this line blocks every browser
          # spec below.
          #
          # It was blocked for a day, to match where production is heading. The cost
          # was the whole web UI suite: `existing-trip`, `onboarding-flow`,
          # `penny-plan-trip`, `lazy-fuel-sourcing`, `vehicle-crud` and
          # `subscriptions` were all paused, because each would be redirected to
          # /get-the-app before its first assertion. That is the only automated
          # proof that Penny plans a trip, that fuel sources lazily, that the
          # paywall blocks and that vehicles can be managed — traded for one
          # spec's worth of edge-redirect coverage.
          #
          # The flag is fixed per deployment, so ONE preview cannot test both
          # states; the blocked side is the second deployment below.
          #
          # The paywall is switched on for this preview by the step above, which
          # writes `app_meta.paywall_enabled` on the Neon branch. It is NOT an
          # env var here any more.
          #
          # `-e PAYWALL_ENABLED="1"` used to be on both deploys below and has
          # been removed rather than left: after the switch moved into the
          # database on 2026-09-02 nothing read it, so it was a line that looked
          # like it controlled the paywall and did not. That is the same trap
          # the stale variable in Vercel is being deleted for.
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URL="${{ steps.neon.outputs.db_url }}" \
            -e E2E_TEST_ENDPOINTS="1" \
            -e WEB_APP_ENABLED="1" \
            -e E2E_TEST_ENDPOINTS_SECRET="$SECRET")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          # A SECOND deployment of the same prebuilt artifact, with the web app
          # switched OFF.
          #
          # One deployment can only be in one state, so a suite running against
          # one of them can only ever prove half of a switch. The half it does
          # not prove is the half that ships: production runs with
          # WEB_APP_ENABLED unset, and until this existed nothing had ever
          # executed that configuration — the block was argued from unit tests
          # and a local reading of middleware.
          #
          # WEB_APP_ENABLED is deliberately NOT passed, so this deployment proves
          # the DEFAULT blocks. It used to pass "0" while production had the
          # variable unset and the default was ON: CI proved "0" blocked, and
          # production served the whole web app to anyone who signed up
          # (2026-09-24). Testing the value production does not have is how
          # that went unseen.
          #
          # Cheap, because everything expensive is already done. Same prebuilt
          # bundle, same Neon branch, same secret; only the env differs. It adds
          # one `vercel deploy` and a handful of assertions, and it is the only
          # thing that can catch a gate that swallows /api or a legal page —
          # the two failures that would take the product down or fail App
          # Review, and neither of which is visible from the open side.
          BLOCKED_URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URL="${{ steps.neon.outputs.db_url }}" \
            -e E2E_TEST_ENDPOINTS="1" \
            -e E2E_TEST_ENDPOINTS_SECRET="$SECRET")"
          echo "blocked_url=$BLOCKED_URL" >> "$GITHUB_OUTPUT"
          echo "Preview (web blocked): $BLOCKED_URL"

          echo "## 🔍 Preview (E2E runs against this exact deployment)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL"

      # Publish the preview URL as ONE sticky comment, deleted and reposted on
      # every push so it is always current and always at the bottom of the
      # thread (see the block comment inside the script for why not edit).
      #
      # It used to ALSO be pinned into the top of the PR description. That was
      # removed on purpose: the URL changes on every push, so a link sitting in
      # the description was a value going stale in the one place a reader
      # assumes is authoritative. Existing PRs that carry the block keep it;
      # nothing here touches the description any more.
      - name: Publish the preview URL on the PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          NEON_BRANCH: ${{ env.NEON_BRANCH }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const url = process.env.PREVIEW_URL;
            const branch = process.env.NEON_BRANCH;
            const sha = pr.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const marker = '<!-- feraltravels-preview -->';

            const body = [
              marker,
              '### 🔍 Preview for this PR',
              '',
              `**${url}**`,
              '',
              `Test the changes here before merging. Fresh clone of the production database (Neon branch \`${branch}\`), rebuilt on every push and deleted when this PR closes — nothing you do here touches prod.`,
              '',
              '⚠️ **Use this URL, not one from an earlier push.** The Neon branch is dropped and recreated on every push, so older preview deployments still point at a database that no longer exists. They fail as an apparent sign-out — you get bounced to `/login` mid-session and signing in again does not help.',
              '',
              `Built from \`${sha}\` · [CI run](${runUrl})`,
            ].join('\n');

            // The sticky comment.
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            /*
             * Delete and REPOST, rather than edit in place.
             *
             * An edited comment stays where it was first written — often pages
             * up a long PR — and GitHub gives no notification that it changed.
             * So the most recent results were the single easiest thing to miss,
             * at exactly the moment they matter: the last look before merging.
             * The stale banner helped and did not fix it, because you still had
             * to go and find the thing to see it was stale.
             *
             * Reposting keeps ONE comment — the old one is removed, so twenty
             * commits do not leave twenty tables — and always puts it at the
             * bottom of the thread, newest, where you are already reading.
             */
            if (existing) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });

  e2e:
    name: E2E tests (against preview)
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium

      # Same derivation as the preview job → same secret, nothing passed
      # through job outputs (GitHub drops outputs containing masked values).
      - name: Derive per-run test-endpoint secret
        env:
          HMAC_KEY: ${{ secrets.AUTH_SECRET }}
        run: |
          # NOTE: derived from run_id ONLY (no run_attempt) — "re-run failed
          # jobs" increments the attempt without redeploying the preview, so
          # including it would desync the runner from the deployed app.
          SECRET="$(printf 'test-endpoints-%s' "${{ github.run_id }}" | openssl dgst -sha256 -hmac "$HMAC_KEY" -r | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          echo "E2E_TEST_ENDPOINTS_SECRET=$SECRET" >> "$GITHUB_ENV"

      # E2E_BASE_URL → playwright.config skips its local webServer and the
      # whole suite (fixtures included) targets the deployed preview.
      - name: Run Playwright against the preview
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
          # The second deployment — same build, WEB_APP_ENABLED unset. Its presence
          # adds the `web-blocked` Playwright project, so ONE `npm run e2e`
          # covers both sides of the switch: one browser resolution, one
          # playwright-results.json, one PR comment, one skip-guard.
          #
          # It was a separate `npx playwright test` first, and that broke twice
          # in a single run. It launched without PLAYWRIGHT_BROWSERS_PATH=0, so
          # Playwright hunted ~/.cache while the install step had put chromium
          # in node_modules; and `--reporter=list` meant it wrote no JSON, so
          # the PR comment reported the FIRST run's 78 passes while the job was
          # red. Both are structural consequences of running the suite twice.
          E2E_BLOCKED_BASE_URL: ${{ needs.preview.outputs.blocked_url }}
          # The real inbox for login-otp.spec.ts — the only spec that sends an
          # actual email and reads it back. Resend Inbound, so it's the account
          # and key we already have. Absent, the spec skips (see
          # E2E_MAX_SKIPPED below); wrong, it fails loudly.
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          E2E_INBOX_DOMAIN: ${{ secrets.E2E_INBOX_DOMAIN }}
          # Only needed if Vercel Deployment Protection is enabled.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e

      # A skipped spec is not a passing spec, and the allowance is now ZERO:
      # every spec must run, including login-otp, which proves the app can
      # actually send a sign-in email. That became possible once AUTH_RESEND_KEY
      # and E2E_INBOX_DOMAIN landed as repo secrets — if either goes missing,
      # login-otp skips and this step reds the build, which is the point.
      #
      # It was briefly 11 while the suite depended on a third-party inbox that
      # got switched off, and a suite testing nothing shipped green for two
      # weeks. If you find yourself raising it, the question to answer first is
      # what the suite has started depending on that it doesn't control.
      - name: Assert the suite actually ran
        if: always()
        env:
          E2E_MAX_SKIPPED: '0'
        run: node scripts/assert-e2e-ran.mjs

      # Always, not just on failure: the report is how you see what the specs
      # actually DID, and that's as useful on a green run as a red one.
      - name: Upload Playwright report
        id: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results.json
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Publish the Playwright HTML report so it is ONE CLICK from the PR —
      # the real report: every step, screenshots, video, and the trace viewer.
      #
      # Deployed via the Build Output API (.vercel/output) so Vercel uploads a
      # FINISHED static site and never tries to detect a framework or run a
      # build — the app project's Next.js preset would otherwise attempt to
      # build a folder of static HTML. That also means it needs no project of
      # its own: it goes to the existing project as an ordinary preview
      # deployment, so there is nothing to create and nothing to configure.
      #
      # The previous version shelled out to `vercel deploy <dir> --yes` hoping
      # it would auto-create a project. It didn't — no such project exists —
      # and because the failure happened inside $(...) with no exit check, the
      # step went green while producing no URL. Hence the explicit exit code
      # check and the unconditional echo of the CLI output below: this can fail
      # again, but it can no longer fail SILENTLY.
      - name: Publish the HTML report
        id: publish
        if: always()
        continue-on-error: true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ ! -f playwright-report/index.html ]; then
            echo "::warning::No HTML report to publish — the suite didn't get that far."
            exit 0
          fi
          npm i -g vercel@latest
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R playwright-report/. .vercel/output/static/
          printf '{"version":3}' > .vercel/output/config.json
          set +e
          OUT="$(vercel deploy --prebuilt --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}" 2>&1)"
          CODE=$?
          set -e
          echo "--- vercel output ---"
          echo "$OUT"
          echo "---------------------"
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::Publishing the report failed (exit $CODE). The PR comment will link the downloadable artifact instead."
            exit 0
          fi
          URL="$(printf '%s' "$OUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n1)"
          if [ -z "$URL" ]; then
            echo "::warning::Deploy succeeded but no URL was found in the output above."
            exit 0
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## 🎭 Playwright report" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Report: $URL"

      # Per-spec results + a link to the report, as a sticky PR comment.
      #
      # The HTML report is a directory, so it can't be inlined, and it is
      # deliberately NOT published to a URL: its screenshots and videos are of
      # a preview backed by a CLONE OF PRODUCTION DATA. The artifact link is
      # behind repo auth; a Pages or Vercel deploy of it would not be.
      - name: Comment E2E results on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
          REPORT_URL: ${{ steps.publish.outputs.url }}
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const marker = '<!-- feraltravels-e2e-results -->';
            let table;
            try {
              table = execFileSync('node', ['scripts/e2e-pr-summary.mjs'], {
                encoding: 'utf8',
                env: {
                  ...process.env,
                  ARTIFACT_URL: process.env.ARTIFACT_URL,
                  REPORT_URL: process.env.REPORT_URL,
                },
              });
            } catch (err) {
              table = `### 🎭 E2E results\n\nCould not build the summary: ${err.message}`;
            }
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              table,
              `Built from \`${pr.head.sha.slice(0, 7)}\` · [CI run](${runUrl})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            /*
             * Delete and REPOST, rather than edit in place.
             *
             * An edited comment stays where it was first written — often pages
             * up a long PR — and GitHub gives no notification that it changed.
             * So the most recent results were the single easiest thing to miss,
             * at exactly the moment they matter: the last look before merging.
             * The stale banner helped and did not fix it, because you still had
             * to go and find the thing to see it was stale.
             *
             * Reposting keeps ONE comment — the old one is removed, so twenty
             * commits do not leave twenty tables — and always puts it at the
             * bottom of the thread, newest, where you are already reading.
             */
            if (existing) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });

  # ── iOS end-to-end, on real simulators ─────────────────────────────────────
  #
  # iOS is the product, so this is where the end-to-end weight sits: the web
  # suite above keeps what does not depend on a screen (the API guards, the legal
  # pages App Review loads, sign-in, the paywall's server side, the web lock).
  #
  # Not React Native Testing Library, deliberately: RNTL renders a component
  # tree in JS with no layout engine and no keyboard, so it would find the
  # composer, assert it exists, and go green while the app was unusable. That is
  # the same green-but-empty shape `scripts/assert-e2e-ran.mjs` exists to catch.
  #
  # ── The shape: build once, then shards in parallel (2026-09-27) ──────────────
  #
  # One job did everything in series — compile (13-16 min), boot (3-8), then
  # every flow as its own `maestro test`, each paying ~1-1.5 min to start the
  # XCTest driver again. Seven flows took 30-45 minutes and a slow runner was
  # cancelled at 45:29 with every flow green (run 36272165470). Adding the
  # screens Playwright used to cover would have put it past an hour. So:
  #
  #   ios-build   compiles the NATIVE app once, in parallel with the unit tests
  #               and the preview deploy (it needs neither), cached by native
  #               fingerprint, and hands it on as an artifact.
  #   ios-e2e     one job per shard (mobile/maestro/shards/<name>.yaml), each on
  #               its own runner and simulator: swap in a JS bundle built for
  #               THIS preview, boot, then launch.yaml and the shard's flows in
  #               ONE Maestro run (one driver start per shard, not per flow).
  #   ios-e2e-summary
  #               keeps the one check name, `iOS e2e (simulator)`, and the one
  #               PR comment, whatever the shard count.
  #
  # Docker is not an option: the iOS Simulator runs only on macOS. The
  # repository is public, so macOS minutes are free; the cost of a shard is a
  # runner slot (five concurrent on the free plan), not money.
  ios-build:
    name: iOS build (simulator app)
    needs: decide
    if: needs.decide.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: mobile

      # ── The cache, and why this one is safe when the last one was not ──
      #
      # There was a `.app` cache once, removed on 2026-08-28: on a hit it
      # skipped the whole build, bundle included, so the simulator would have
      # launched an app pointed at a PREVIOUS PR's torn-down preview. The URL is
      # inlined at BUNDLE time. The fix is to stop caching the bundle, not to
      # stop caching the compile: this job builds against a placeholder host,
      # and every shard runs `scripts/ios-rebundle.sh`, which replaces the
      # bundle with one built for its own preview and FAILS if the result does
      # not contain that preview's host or still contains the placeholder.
      #
      # Keyed on the native fingerprint (`@expo/fingerprint`: native deps,
      # app config, config plugins, patches), the runner image and the Xcode
      # that compiles it. A PR's cache is visible only to that PR and to `main`,
      # so the first push of a PR compiles and every later push restores.
      - name: Fingerprint the native app
        id: fp
        working-directory: mobile
        run: |
          set -euo pipefail
          HASH="$(npx fingerprint fingerprint:generate --platform ios | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).hash))")"
          XCODE="$(xcodebuild -version | awk 'NR==1 {print $2}')"
          echo "key=ios-sim-app-v1-${ImageOS}-${ImageVersion}-xcode${XCODE}-${HASH}" >> "$GITHUB_OUTPUT"
          echo "Native fingerprint $HASH (Xcode $XCODE, image $ImageOS $ImageVersion)"

      - name: Restore the compiled app
        id: cache
        uses: actions/cache@v4
        with:
          path: mobile/ios-build
          key: ${{ steps.fp.outputs.key }}

      # RELEASE, not Debug, and this is a correction rather than a preference.
      # A Debug build contains NO JavaScript — it fetches its bundle from a Metro
      # packager at launch, and nothing here runs one — so it came up on the red
      # box "No script URL provided" every time (2026-09-01). Release is also the
      # configuration the flows claim to test: `__DEV__` off, the JS that ships.
      #
      # Default Xcode (16.4, iOS 18.5 SDK), deliberately: that is the build that
      # has been shipping. The shards select Xcode 26.2 for Maestro's driver,
      # and an 18.5 app runs fine on a 26.2 simulator.
      #
      # NO EXTRA BUILD SETTINGS, measured: ONLY_ACTIVE_ARCH / index store / dwarf
      # moved the build 14m06s → 14m46s, and the arch flag was a no-op (the four
      # `-arch x86_64` lines are toolchain probes). And NO CODE_SIGNING_ALLOWED=NO:
      # expo-secure-store needs the entitlements an unsigned build lacks, and
      # sign-in died storing the session. A simulator build signs ad hoc.
      - name: Build the app for the simulator
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # A host that cannot resolve, so an app that somehow kept this bundle
          # fails loudly — and ios-rebundle.sh refuses to hand it on anyway.
          EXPO_PUBLIC_API_URL: https://ios-bundle-placeholder.invalid
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --clean
          # Derived, never hardcoded: prebuild names the workspace after
          # app.config.js's `name`.
          WORKSPACE="$(ls -d ios/*.xcworkspace | head -1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building scheme $SCHEME from $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build
          mkdir -p ios-build
          cp -R ios/build/Build/Products/Release-iphonesimulator/*.app ios-build/

      # A tarball, not the directory: upload-artifact does not keep the
      # executable bit, and an .app whose binary lost it does not launch.
      - name: Pack the app
        run: tar -czf ios-sim-app.tgz -C mobile/ios-build .

      - uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          path: ios-sim-app.tgz
          retention-days: 1
          if-no-files-found: error

  ios-e2e:
    name: iOS e2e · ${{ matrix.shard }}
    needs: [decide, preview, ios-build]
    if: needs.decide.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      # Every shard reports. A red `core` must not cancel a `trips` that would
      # have said something different about the same commit.
      fail-fast: false
      matrix:
        # Chosen by the decide job from mobile/maestro/shards/*.yaml; `ai` is in
        # it only on a run started by the `ai-tests` label (see decide).
        shard: ${{ fromJSON(needs.decide.outputs.ios_shards) }}
    env:
      # ONE definition, read by both the install step and its cache key.
      # It pairs with the Xcode selected below: Maestro ships a PREBUILT iOS
      # driver, so the release and the Xcode that built it move together.
      # `scripts/ios-e2e-local.sh` carries the same pin as `MAESTRO_PIN`.
      # When bumping, check which Xcode that release's `rebuild-ios-drivers.yaml`
      # used and move the `xcode-select` with it.
      MAESTRO_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@v4

      # ── The toolchain Maestro's driver needs ────────────────────────────
      #
      # Maestro does not compile its iOS driver on the runner; it ships a
      # prebuilt runner and `.xctestrun` built with Xcode 26.2
      # (`rebuild-ios-drivers.yaml` in mobile-dev-inc/maestro). The image's
      # default 16.4 cannot run it: `xcodebuild` returns instantly, nothing
      # listens on port 7001, and Maestro reports "iOS driver not ready in
      # time" — a message that names a timeout and is not about one.
      - name: Select the Xcode that Maestro's driver was built with
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      # STARTED here and waited for later: a boot takes 3-8 minutes on these
      # runners and needs nothing the next steps produce, so it runs while the
      # bundle is built. `simctl boot` returns once the boot has begun;
      # `bootstatus -b` in the install step is the wait.
      - name: Start booting a simulator
        run: |
          set -euo pipefail
          # Nothing else booted: Maestro finds its device by looking for a
          # BOOTED simulator, and a stray one is a device with no app on it.
          xcrun simctl shutdown all || true
          # The SOFTWARE keyboard has to exist, and this must be set BEFORE the
          # boot — a booted device ignores it. With the default hardware
          # keyboard the field focuses and text types but `keyboardWillShow`
          # never fires, and `chat-keyboard.yaml` fails on the one thing it
          # exists to prove.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          # The NEWEST runtime on the image, not the first iPhone simctl names
          # (an 18.5 one — a runtime the 26.2 driver was never built against).
          read -r UDID LABEL <<<"$(node scripts/pick-ios-simulator.mjs)"
          echo "Booting $LABEL ($UDID)"
          xcrun simctl boot "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: mobile

      - uses: actions/download-artifact@v4
        with:
          name: ios-sim-app

      # The compiled app from ios-build, with a bundle built for THIS preview.
      # ios-rebundle.sh fails the job if the bundle does not carry the preview's
      # host, so a stale URL cannot reach a flow and look like a broken app.
      - name: Put this preview's JavaScript into the app
        env:
          API_URL: ${{ needs.preview.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p ios-app
          tar -xzf ios-sim-app.tgz -C ios-app
          scripts/ios-rebundle.sh ios-app/*.app "$API_URL"

      - name: Wait for the simulator and install the app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" ios-app/*.app
          # ── Warm the simulator before Maestro touches it ────────────────
          #
          # 2026-09-07 (run 34101156123): Maestro's XCTest runner STALLED on a
          # freshly booted simulator and the job died "iOS driver not ready in
          # time" before launch.yaml ran. Every green run shows the driver up
          # ~30s after launch on a simulator that has already run a process. So
          # launch the app once and put it down: SpringBoard's first-boot work
          # happens on our clock. Tolerant: launch.yaml reports it better.
          xcrun simctl launch "$SIM_UDID" com.feraltravels.ios || echo "::warning::warm-up launch failed; launch.yaml will say why"
          sleep 5
          xcrun simctl terminate "$SIM_UDID" com.feraltravels.ios || true
          # ── And warm the SETTINGS app ───────────────────────────────────
          #
          # settings-location.yaml asserts our screen goes away when the switch
          # opens Settings, and com.apple.Preferences' cold first launch on a
          # contended runner measured pass/fail/pass/fail across four runs
          # (11s, 12.3s, 26s not enough). Paying it here was the fix. Cheap on a
          # shard that does not need it.
          xcrun simctl launch "$SIM_UDID" com.apple.Preferences || echo "::warning::Settings warm-up failed; settings-location may be slow"
          sleep 3
          xcrun simctl terminate "$SIM_UDID" com.apple.Preferences || true

      # PINNED, with the version as a JOB-level env so this key and the
      # installer read the SAME value — a key that disagreed with the pin would
      # serve a different Maestro, whose driver/Xcode mismatch presents as a
      # timeout naming no version.
      - name: Cache Maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: Install Maestro
        run: |
          set -euo pipefail
          if [ -x "$HOME/.maestro/bin/maestro" ]; then
            echo "Maestro restored from cache"
          else
            curl -Ls https://get.maestro.mobile.dev | bash
          fi
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      # Same derivation as the preview and e2e jobs — computed, never passed
      # through job outputs, because GitHub drops outputs containing masked
      # values. Uses run_id only: "re-run failed jobs" bumps the attempt without
      # redeploying the preview, and including it would desync from the app.
      - name: Derive per-run test-endpoint secret
        env:
          HMAC_KEY: ${{ secrets.AUTH_SECRET }}
        run: |
          SECRET="$(printf 'test-endpoints-%s' "${{ github.run_id }}" | openssl dgst -sha256 -hmac "$HMAC_KEY" -r | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          echo "E2E_TEST_ENDPOINTS_SECRET=$SECRET" >> "$GITHUB_ENV"

      # ONE ACCOUNT PER SHARD. Each shard runs on its own simulator at the same
      # time as the others, and the sign-in code is single-use; two shards on
      # one address would spend each other's codes. The address carries a
      # timestamp, so two invocations never collide.
      - name: Mint the fixture account
        id: fixture
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Seeds the account and proves the send path works before a simulator
          # is involved. It deliberately does NOT hand over a code: one minted
          # here is replaced by the app's own send once the 60s resend cooldown
          # lapses. read-otp.js reads the live one from inside the flow.
          node scripts/ios-e2e-fixture.mjs --base-url "${{ needs.preview.outputs.url }}" > fixture.env
          cat fixture.env >> "$GITHUB_ENV"

      - name: Run the flows
        id: flows
        env:
          # read-otp.js and the seed scripts call this deployment themselves.
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
          SHARD: ${{ matrix.shard }}
          # 240s, the budget Maestro uses in its own iOS CI. Headroom for a cold
          # runner, NOT the fix for a driver that never starts (that is Xcode).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
        run: |
          # LAYER 1 FIRST, on its own. `launch.yaml` needs no network and no
          # fixture account: it proves the driver came up, the build installed
          # and the app renders its first screen. When it fails the problem is
          # the harness, and nothing below it is worth reading.
          #
          # RETRIED ONCE, ON ONE SIGNATURE ONLY. `iOS driver not ready in time`
          # means Maestro's XCTest runner never answered — no flow ran and the
          # app was never touched — so a fresh simulator is the fix: kill the
          # stuck xcodebuild, reboot the same UDID, warm it, go again. Any OTHER
          # failure is the app, is not retried, and fails the job. A generic
          # step-retry would retry those too, which is how a regression becomes
          # "flaky". The retry is surfaced in the PR comment.
          DRIVER_TIMEOUT_SIGNATURE='iOS driver not ready in time'
          HARNESS_RETRIED=0
          run_launch() {
            maestro --device "$SIM_UDID" test mobile/maestro/launch.yaml \
              -e APP_ID=com.feraltravels.ios \
              --format junit \
              --output "maestro-report-$SHARD-launch.xml" \
              --debug-output maestro-debug 2>&1 | tee "launch-attempt-$1.log"
            return "${PIPESTATUS[0]}"
          }
          for attempt in 1 2; do
            if run_launch "$attempt"; then break; fi
            if [ "$attempt" = 2 ] || ! grep -q "$DRIVER_TIMEOUT_SIGNATURE" "launch-attempt-$attempt.log"; then
              echo "harness_retried=$HARNESS_RETRIED" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "::warning::launch.yaml: the XCTest driver never came up (attempt $attempt). Rebooting the simulator and retrying once."
            HARNESS_RETRIED=1
            pkill -f "xcodebuild test-without-building" || true
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl boot "$SIM_UDID"
            xcrun simctl bootstatus "$SIM_UDID" -b
            xcrun simctl launch "$SIM_UDID" com.feraltravels.ios || true
            sleep 5
            xcrun simctl terminate "$SIM_UDID" com.feraltravels.ios || true
          done
          echo "harness_retried=$HARNESS_RETRIED" >> "$GITHUB_OUTPUT"

          # THE SHARD, in ONE Maestro run: one driver start instead of one per
          # flow. `--config` names the flows and their ORDER
          # (`executionOrder.flowsOrder`) — order matters inside a shard, e.g.
          # settings-location spends the location dialog for the install and so
          # runs last. The workspace is the directory, but only the listed flows
          # run: sign-in.yaml is a subflow and must not run standalone, because
          # the sign-in code is single-use and a second sign-in would find it
          # spent. `continueOnFailure` so one red flow does not hide the rest.
          #
          # Every variable any flow reads is passed to every shard;
          # src/lib/maestroFlowParams.test.ts fails if a flow references one no
          # runner supplies — Maestro does not fail on an undefined variable, it
          # silently fails to match.
          maestro --device "$SIM_UDID" test mobile/maestro \
            --config "mobile/maestro/shards/$SHARD.yaml" \
            -e APP_ID=com.feraltravels.ios \
            -e EMAIL="$EMAIL" \
            -e TRIP_NAME="$TRIP_NAME" \
            -e TRIP_ID="$TRIP_ID" \
            -e BASE_URL="$E2E_BASE_URL" \
            -e TEST_SECRET="$E2E_TEST_ENDPOINTS_SECRET" \
            --format junit \
            --output "maestro-report-$SHARD.xml" \
            --debug-output maestro-debug

      # WHICH STEP FAILED, in the log, without downloading anything. The first
      # failing run said exactly "[Failed] chat-keyboard (28s)" and nothing
      # else; the answer was behind a login, a download and an unzip.
      - name: Say where the flow died
        if: failure()
        run: |
          echo "::group::maestro-report.xml"
          cat maestro-report*.xml 2>/dev/null || echo "(no report produced)"
          echo "::endgroup::"
          # WHICH LINE OF THE YAML: `commands-*.json` records every step and its
          # status; the JUnit's `<failure>Unknown error</failure>` does not.
          echo "::group::which step failed"
          find maestro-debug -name 'commands-*.json' 2>/dev/null | while read -r f; do
            echo "--- $f"; cat "$f"
          done || echo "(no command log)"
          echo "::endgroup::"
          echo "::group::maestro.log"
          find maestro-debug -name 'maestro.log' 2>/dev/null | while read -r f; do
            echo "--- $f"; tail -120 "$f"
          done || echo "(no maestro.log)"
          echo "::endgroup::"
          echo "::group::screenshots captured"
          find maestro-debug -name '*.png' 2>/dev/null | sed 's/^/  /' || true
          echo "  (download this shard's maestro-ios artifact to view them)"
          echo "::endgroup::"
          # The XCTest runner's own log: where a driver that never comes up
          # says why.
          echo "::group::XCTest driver log and simulator state"
          xcodebuild -version || true
          xcrun simctl list devices booted || true
          find "$HOME/.maestro/tests" -name '*.log' -mmin -60 2>/dev/null | tail -3 | while read -r f; do
            echo "--- $f"; tail -80 "$f"
          done || echo "(no driver log)"
          echo "::endgroup::"

      # `include-hidden-files: true` is not tidiness: Maestro writes under
      # `<--debug-output>/.maestro/tests/<timestamp>/`, and upload-artifact has
      # skipped dotfiles since v4.4 — run 119's artifact was 502 bytes.
      - name: Upload the recordings
        id: recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-${{ matrix.shard }}
          path: |
            maestro-report*.xml
            maestro-debug/**
            ~/.maestro/tests/**
          include-hidden-files: true
          if-no-files-found: warn

      # What the summary job needs to write ONE comment for all shards: a
      # matrix job's outputs are overwritten by whichever instance ends last,
      # so each shard leaves a small file instead.
      - name: Record this shard's outcome
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.flows.outcome }}
          HARNESS_RETRIED: ${{ steps.flows.outputs.harness_retried }}
          ARTIFACT_URL: ${{ steps.recordings.outputs.artifact-url }}
        run: |
          node -e "console.log(JSON.stringify({shard:process.env.SHARD,outcome:process.env.OUTCOME||'skipped',harnessRetried:process.env.HARNESS_RETRIED==='1',artifactUrl:process.env.ARTIFACT_URL||''}))" > "ios-shard-$SHARD.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-shard-${{ matrix.shard }}
          path: ios-shard-${{ matrix.shard }}.json
          retention-days: 3

  ios-e2e-summary:
    # The check name the PR has always shown. The deploy gate reads the run's
    # overall conclusion, and branch protection requires only Decide scope and
    # Unit tests, so the shard count can change without touching either.
    name: iOS e2e (simulator)
    needs: [decide, ios-e2e]
    if: always() && needs.decide.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-shard-*
          merge-multiple: true
          path: shards

      - name: Comment iOS results on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SHARDS: ${{ needs.decide.outputs.ios_shards }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- feraltravels-ios-e2e -->';
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const expected = JSON.parse(process.env.SHARDS || '[]');
            const results = {};
            for (const f of fs.existsSync('shards') ? fs.readdirSync('shards') : []) {
              try {
                const r = JSON.parse(fs.readFileSync(`shards/${f}`, 'utf8'));
                results[r.shard] = r;
              } catch { /* a malformed file reads as "did not run" below */ }
            }
            const icon = { success: '✅', failure: '❌', cancelled: '⚪', skipped: '⚪' };
            const lines = ['### 📱 iOS e2e (simulator)', '', '| Shard | Result |', '|---|---|'];
            let allGreen = expected.length > 0;
            for (const shard of expected) {
              const r = results[shard];
              const outcome = r?.outcome || 'did not run';
              if (outcome !== 'success') allGreen = false;
              const link = r?.artifactUrl ? ` · [recordings](${r.artifactUrl})` : '';
              const retry = r?.harnessRetried ? ' · ⚠️ harness retried once' : '';
              lines.push(`| \`${shard}\` | ${icon[outcome] || '⚪'} ${outcome}${link}${retry} |`);
            }
            lines.push('');
            lines.push(allGreen
              ? "**Passed.** Every shard ran its flows on a booted simulator against this PR's own preview."
              : '**Not green.** A failed shard\'s recordings hold a screenshot of the screen it died on — the fastest way in.');
            if (!expected.includes('ai')) {
              lines.push('', 'The Penny flows (`ai` shard) did not run — add the `ai-tests` label to run them.');
            }
            // A harness retry is a fact about the runners: visible on green too.
            if (Object.values(results).some((r) => r.harnessRetried)) {
              lines.push('', '⚠️ **Harness retried once** on a shard: the XCTest driver did not come up on the first attempt (a simulator flake, not the app).');
            }
            lines.push('', `Built from \`${pr.head.sha.slice(0, 7)}\` · [CI run](${runUrl})`);

            const body = [marker, ...lines].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            // Delete and repost — an edited comment keeps its ORIGINAL timeline
            // position, where a stale green would sit above newer commits.
            if (existing) {
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
            }
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });

      - name: Fail unless every shard passed
        env:
          RESULT: ${{ needs.ios-e2e.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = "success" ]
