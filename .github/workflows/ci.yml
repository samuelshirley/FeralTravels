# CI — every PR / push to main must pass before you rely on it for quality.
#
# Full Playwright E2E (npm run e2e) needs DATABASE_URL, Google Maps keys,
# optional Anthropic for Penny tests, plus seed cleanup — run locally via
# `npm run ship` or interactively `npm run e2e`. This workflow keeps merges
# safe with build + unit tests without secret sprawl.

name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint + typecheck (via Next.js build)
        run: npm run build

      - name: Unit tests
        run: npm run test
