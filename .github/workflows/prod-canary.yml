# prod-canary — plans a real trip on PRODUCTION twice a day and files an issue
# when any part of it breaks.
#
# WHY. On 2026-11-02 production's ANTHROPIC_API_KEY had been expired for over a
# week and every check was green: CI, previews and the ai-tests shard all run on
# ANTHROPIC_API_KEY_CI (src/lib/anthropicKey.ts), so nothing ever exercised
# production's key. The first outside user found it. This is the check that
# would have.
#
# WHAT. scripts/prod-canary.mjs (header): onboarding → hand-off turn
# (Girona → Barcelona) → a low-tank turn that forces a real Places search →
# read the trip back → delete it. Over the same HTTP API the iOS app uses,
# signed in as samuelashirley+canary@gmail.com with a real 30-day session.
#
# COST. Actions minutes: free (public repo). Production spend, measured
# 2026-11-03: ~10–15¢ of Anthropic per run plus Google Directions/Places — so
# twice a day, ~$0.25/day. The account's $0.50/day AI cap is why it is not more
# often; the iOS simulator canary (scripts/prod-canary-ios.sh) runs on its own
# account in between, so production is checked about every six hours.
#
# SECRETS. PROD_CANARY_TOKEN and PROD_CANARY_TOKEN_EXPIRES, both written by
# scripts/prod-canary-token.sh. The run alerts five days before the session
# lapses, so renewal is a scheduled chore, not an outage.
#
# NOISE. Same contract as oauth-provider-probe.yml: one open issue at a time,
# labelled `prod-canary`; body rewritten while failing, a comment at most every
# six hours, one comment on recovery. The job itself also goes red, so GitHub's
# failed-workflow email arrives too.
#
# GitHub disables scheduled workflows in a public repo after 60 days with no
# commits. If this goes quiet, check the Actions tab before assuming health.
name: Production canary

on:
  schedule:
    # 05:37 and 17:37 UTC — 06:37/18:37 in Girona (winter). Off the hour on
    # purpose: GitHub delays :00 schedules under load.
    - cron: '37 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Plan Girona → Barcelona on production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Canary
        id: canary
        env:
          PROD_CANARY_TOKEN: ${{ secrets.PROD_CANARY_TOKEN }}
          PROD_CANARY_TOKEN_EXPIRES: ${{ secrets.PROD_CANARY_TOKEN_EXPIRES }}
        run: node scripts/prod-canary.mjs --json canary.json

      - name: Open, update or resolve the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.canary.outputs.alert || 'true' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL=prod-canary
          gh label create "$LABEL" --color B60205 \
            --description "Opened by .github/workflows/prod-canary.yml" 2>/dev/null || true

          if [ -f canary.json ]; then
            summary="$(node -e 'process.stdout.write(require("./canary.json").summary)')"
          else
            summary="The canary crashed before writing a report — read the run log."
          fi
          issue="$(gh issue list --label "$LABEL" --state open --limit 1 --json number -q '.[0].number // empty')"
          now="$(date -u +%s)"
          was_recovered=false
          if [ -n "$issue" ]; then
            old_body="$(gh issue view "$issue" --json body -q .body)"
            case "$old_body" in "**Status: recovered"*) was_recovered=true ;; esac
          fi

          body_file="$(mktemp)"
          {
            if [ "$ALERT" = "true" ]; then echo "**Status: ALERTING** (latest run below)"; else echo "**Status: recovered** — latest run below is healthy. Close this when satisfied."; fi
            echo
            echo "$summary"
            echo
            echo "Latest run: $RUN_URL"
            echo
            echo "What each step proves: \`scripts/prod-canary.mjs\` (header). Session about to lapse: \`scripts/prod-canary-token.sh\`."
          } > "$body_file"

          if [ "$ALERT" = "true" ]; then
            if [ -z "$issue" ]; then
              gh issue create --label "$LABEL" --title "Production canary: planning a trip on production is failing" --body-file "$body_file"
              exit 0
            fi
            gh issue edit "$issue" --body-file "$body_file"
            last="$(gh issue view "$issue" --json comments,createdAt -q '(.comments | map(.createdAt) | last) // .createdAt')"
            last_s="$(date -u -d "$last" +%s)"
            if [ "$was_recovered" = "true" ]; then
              printf 'Failing again.\n\n%s\n\n%s\n' "$summary" "$RUN_URL" | gh issue comment "$issue" --body-file -
            elif [ $(( now - last_s )) -ge 21600 ]; then
              printf 'Still failing.\n\n%s\n\n%s\n' "$summary" "$RUN_URL" | gh issue comment "$issue" --body-file -
            fi
          elif [ -n "$issue" ]; then
            if [ "$was_recovered" = "false" ]; then
              gh issue edit "$issue" --body-file "$body_file"
              printf 'Recovered: this run was healthy.\n\n%s\n\n%s\n' "$summary" "$RUN_URL" | gh issue comment "$issue" --body-file -
            fi
          fi
