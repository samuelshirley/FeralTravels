# Deploy — preview-gated, CI-orchestrated promote to production.
#
# Three jobs run on every push to main, each gating the next:
#   1. unit     — npm ci + unit tests (fast fail before we spend time on Vercel).
#   2. e2e      — wait for Vercel's PREVIEW deployment of this commit, then seed
#                 the fixture and run Playwright against the preview URL. This is
#                 its OWN job so it shows up as a distinct check and so a failure
#                 here visibly blocks promotion. Exposes the tested deployment id.
#   3. promote  — `needs: e2e`, so it ONLY runs when e2e is green. Aliases the
#                 prod domain to the EXACT deployment e2e just tested (no rebuild),
#                 then backfills legacy Google Maps URLs.
#
# If e2e fails (or never reaches the tests), promote never runs and prod stays on
# the previous deployment. Emergency rollback = Vercel dashboard → prior
# deployment → Promote to Production. There is deliberately NO skip-CI escape hatch.
#
# NOTE: this gate is only the SOLE path to prod once Vercel's own Git auto-promote
# for `main` is turned off (Vercel → Project → Settings → Git → Production Branch
# set to a non-existent name). Until then, Vercel also auto-promotes on push.

name: Deploy

on:
  push:
    branches: [main]

# One push at a time. A newer push cancels an in-flight run so an older commit
# can never promote over a newer one, and two runs never collide on the shared
# seed database mid-suite.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E tests
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    # Expose the deployment we tested so the promote job can alias the EXACT
    # same build to production (no rebuild between test and promote).
    outputs:
      deployment_id: ${{ steps.preview.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Fail fast with a clear message if a required secret is missing, instead
      # of burning 5 minutes on the Vercel wait below and timing out silently.
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub Actions secret(s):$missing — set them in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Wait for Vercel preview deployment
        id: preview
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v6/deployments"
          query="projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&meta-githubCommitSha=${GITHUB_SHA}&limit=1"
          deadline=$((SECONDS + 300))   # 5 minutes
          while [ "$SECONDS" -lt "$deadline" ]; do
            resp="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$api?$query")"
            state="$(echo "$resp" | jq -r '.deployments[0].state // .deployments[0].readyState // empty')"
            id="$(echo "$resp" | jq -r '.deployments[0].uid // empty')"
            host="$(echo "$resp" | jq -r '.deployments[0].url // empty')"
            echo "state=${state:-<none>} id=${id:-<none>} host=${host:-<none>}"
            case "$state" in
              READY)
                echo "id=$id" >> "$GITHUB_OUTPUT"
                echo "url=https://$host" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              ERROR|CANCELED|DELETED)
                echo "::error::Preview deployment ended in state: $state"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out after 5min waiting for a READY preview for $GITHUB_SHA"
          exit 1

      - name: Install Playwright browsers
        # `npm run e2e` runs with PLAYWRIGHT_BROWSERS_PATH=0 (browsers live under
        # node_modules), so install to the SAME path — otherwise the run can't
        # find the binary ("Executable doesn't exist at .../.local-browsers").
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium

      - name: Seed E2E fixture
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_TEST_BACKDOOR_EMAIL: ${{ secrets.AUTH_TEST_BACKDOOR_EMAIL }}
          E2E_FIXTURE_EMAIL: ${{ secrets.E2E_FIXTURE_EMAIL }}
        run: npm run e2e:seed

      - name: Run Playwright against preview
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_TEST_BACKDOOR_EMAIL: ${{ secrets.AUTH_TEST_BACKDOOR_EMAIL }}
          E2E_FIXTURE_EMAIL: ${{ secrets.E2E_FIXTURE_EMAIL }}
        run: npm run e2e

      - name: Clean up E2E rows
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_TEST_BACKDOOR_EMAIL: ${{ secrets.AUTH_TEST_BACKDOOR_EMAIL }}
          E2E_FIXTURE_EMAIL: ${{ secrets.E2E_FIXTURE_EMAIL }}
        run: npm run e2e:cleanup

  promote:
    name: Promote to production
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Promote tested deployment to production
        run: vercel promote "${{ needs.e2e.outputs.deployment_id }}" --token="$VERCEL_TOKEN" --yes

      - name: Backfill legacy Google Maps URLs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run backfill-maps-nav
