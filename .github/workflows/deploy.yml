# CI gate — test every push to main against an EPHEMERAL Neon branch, never prod.
#
# Flow (single branch, no staging environment):
#   1. unit  — npm ci + unit tests (fast fail).
#   2. e2e   — create a throwaway Neon branch (copy-on-write clone of prod data),
#              run migrations on it, build the app and run the full Playwright
#              suite against a LOCAL `next start` pointed at that branch, then
#              delete the branch. The app runs with AUTH_TEST_BACKDOOR on so the
#              /api/test/* fixtures work; E2E never touches the prod database.
#   3. preview — after e2e is green, deploy a clickable Vercel PREVIEW (never
#              promoted) pointed at a rolling "preview" Neon branch, so you can
#              eyeball the change before promoting. URL is printed to the summary.
#
# There is NO auto-promote here. Production is updated only by the manual
# "Promote to production" workflow (.github/workflows/promote.yml), and Vercel's
# own git auto-deploy for main is disabled in vercel.json
# (git.deploymentEnabled.main = false). Green here = the commit is promotable.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   NEON_API_KEY, NEON_PROJECT_ID   (from the Neon GitHub integration)
#   AUTH_SECRET, AUTH_GOOGLE_ID, AUTH_GOOGLE_SECRET, AUTH_RESEND_KEY,
#     AUTH_EMAIL_FROM   (Auth.js runtime config — the app runs locally here)
#   ANTHROPIC_API_KEY, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
#   AUTH_TEST_BACKDOOR_EMAIL, E2E_FIXTURE_EMAIL
#   MAILSLURP_API_KEY   (real OTP e2e; login-otp skips without it)
# NOTE: the prod DATABASE_URL secret is intentionally NOT used by this job.

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test

  e2e:
    name: E2E tests (ephemeral Neon branch)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # A disposable, copy-on-write clone of prod data. Auto-deleted below.
      - name: Create ephemeral Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Apply migrations to the branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:migrate

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium

      # No E2E_BASE_URL → Playwright builds + starts the app locally (see
      # playwright.config webServer) with this env, and seeds/tests via the
      # /api/test/* HTTP endpoints. DATABASE_URL points at the ephemeral branch.
      - name: Run Playwright
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          # Auth.js v5 runtime config — required because the app runs locally in
          # this job (not a Vercel preview), so it can't inherit Vercel's env.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          AUTH_TEST_BACKDOOR: '1'
          AUTH_TEST_BACKDOOR_EMAIL: ${{ secrets.AUTH_TEST_BACKDOOR_EMAIL }}
          E2E_FIXTURE_EMAIL: ${{ secrets.E2E_FIXTURE_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          # Real OTP e2e (login-otp.spec) — MailSlurp inbox reads the actual
          # emailed code. Skips if unset.
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
        run: npm run e2e

      # Always drop the branch, even on failure, so they don't accumulate.
      - name: Delete ephemeral Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ci-${{ github.run_id }}-${{ github.run_attempt }}

  # Clickable "eyeball" preview of the tested commit — deployed to Vercel as a
  # PREVIEW (never promoted), pointed at its own rolling Neon branch ("preview",
  # a fresh copy of prod data refreshed each push) so you can click around
  # without touching real prod data. The URL is printed to the run summary.
  # Runs only after e2e is green, so a preview always reflects a promotable build.
  preview:
    name: Deploy eyeball preview
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Refresh the single rolling "preview" branch: drop the old one (ignore if
      # absent), then re-create it from prod so the preview shows current data.
      - name: Delete previous preview Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview
      - name: Create fresh preview Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview
      - name: Apply migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:migrate

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deploy as a preview (no --prod) with DATABASE_URL overridden to the
      # rolling preview branch. NEXT_PUBLIC_* build-time vars come from the
      # project's preview env via `vercel pull`. No AUTH_TEST_BACKDOOR here — the
      # eyeball preview behaves like real prod (sign in with OTP to your email).
      - name: Deploy preview + print URL
        run: |
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" -e DATABASE_URL="${{ steps.neon.outputs.db_url }}")"
          echo "## 🔍 Eyeball preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL"
