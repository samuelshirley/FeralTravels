# CI gate — build ONE preview per push, test against it, never touch prod.
#
# Flow (single branch, no staging environment):
#   1. unit    — npm ci + unit tests (fast fail).
#   2. preview — refresh the rolling "preview" Neon branch (copy-on-write clone
#                of prod data), run migrations on it, and deploy a Vercel
#                PREVIEW pointed at it. This is THE preview: the E2E suite runs
#                against this exact URL, and the same URL is printed to the run
#                summary for eyeballing. It deploys BEFORE tests so you always
#                get a clickable preview even when a spec is red (test bug vs
#                app bug). The app runs with E2E_TEST_ENDPOINTS on so the
#                /api/test/* FIXTURE-DATA endpoints work — guarded by a per-run
#                secret (see below) since the URL is internet-reachable.
#   3. e2e     — run the full Playwright suite against the preview URL
#                (E2E_BASE_URL → playwright.config skips its local webServer).
#                Artifacts (report + traces) upload on failure.
#
# There is NO auth bypass anywhere: e2e signs in as fresh MailSlurp users
# through the real OTP email flow. The /api/test/* endpoints only seed/reset
# fixture DATA, are hard-off on VERCEL_ENV=production, and on the public
# preview URL additionally require a per-run secret: both jobs derive the same
# HMAC(AUTH_SECRET, run id) — the preview app requires it in the
# x-e2e-test-secret header (E2E_TEST_ENDPOINTS_SECRET), the Playwright runner
# sends it. No extra repo secret to manage; it rotates every run.
#
# There is NO auto-promote here. Production is updated only by the manual
# "Promote to production" workflow (.github/workflows/promote.yml) — which now
# refuses to promote a commit whose CI run isn't green — and Vercel's own git
# auto-deploy for main is disabled in vercel.json
# (git.deploymentEnabled.main = false).
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   NEON_API_KEY, NEON_PROJECT_ID   (from the Neon GitHub integration)
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   AUTH_SECRET                     (also the HMAC key for the per-run test-endpoint secret)
#   ANTHROPIC_API_KEY               (runner-side gate so the Penny spec runs)
#   MAILSLURP_API_KEY               (REQUIRED for a meaningful run: every spec
#                                    signs in via a real OTP email; without it
#                                    all authenticated specs skip)
#   VERCEL_AUTOMATION_BYPASS_SECRET (optional — only if Vercel Deployment
#                                    Protection is enabled on the project)
# App runtime/build env (ANTHROPIC_API_KEY, AUTH_RESEND_KEY, AUTH_EMAIL_FROM,
# NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, …) comes from the Vercel project's PREVIEW
# environment via `vercel pull` — keep that env complete there, not here.
# NOTE: the prod DATABASE_URL secret is intentionally NOT used by this workflow.

name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test

  # THE preview — tested by e2e below, clickable by humans from the summary.
  preview:
    name: Deploy tested preview
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Refresh the single rolling "preview" branch: drop the old one (ignore if
      # absent), then re-create it from prod so the preview shows current data.
      # E2E seeds its fixture users into this branch over HTTP; prod is untouched.
      - name: Delete previous preview Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: preview
      - name: Create fresh preview Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: preview
      - name: Apply migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:migrate

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deploy as a preview (no --prod). Build-time env (NEXT_PUBLIC_*) comes
      # from the project's preview environment via `vercel pull`; runtime env
      # is overridden per-deployment: DATABASE_URL → the rolling preview
      # branch, plus the guarded fixture-data endpoints so E2E seeding works.
      - name: Deploy preview + print URL
        id: deploy
        env:
          HMAC_KEY: ${{ secrets.AUTH_SECRET }}
        run: |
          # NOTE: derived from run_id ONLY (no run_attempt) — "re-run failed
          # jobs" increments the attempt without redeploying the preview, so
          # including it would desync the runner from the deployed app.
          SECRET="$(printf 'test-endpoints-%s' "${{ github.run_id }}" | openssl dgst -sha256 -hmac "$HMAC_KEY" -r | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"
          URL="$(vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" \
            -e DATABASE_URL="${{ steps.neon.outputs.db_url }}" \
            -e E2E_TEST_ENDPOINTS="1" \
            -e E2E_TEST_ENDPOINTS_SECRET="$SECRET")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## 🔍 Preview (E2E runs against this exact deployment)" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $URL"

  e2e:
    name: E2E tests (against preview)
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium

      # Same derivation as the preview job → same secret, nothing passed
      # through job outputs (GitHub drops outputs containing masked values).
      - name: Derive per-run test-endpoint secret
        env:
          HMAC_KEY: ${{ secrets.AUTH_SECRET }}
        run: |
          # NOTE: derived from run_id ONLY (no run_attempt) — "re-run failed
          # jobs" increments the attempt without redeploying the preview, so
          # including it would desync the runner from the deployed app.
          SECRET="$(printf 'test-endpoints-%s' "${{ github.run_id }}" | openssl dgst -sha256 -hmac "$HMAC_KEY" -r | cut -d' ' -f1)"
          echo "::add-mask::$SECRET"
          echo "E2E_TEST_ENDPOINTS_SECRET=$SECRET" >> "$GITHUB_ENV"

      # E2E_BASE_URL → playwright.config skips its local webServer and the
      # whole suite (fixtures included) targets the deployed preview.
      - name: Run Playwright against the preview
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}
          # Runner-side gate only (the app's own key comes from Vercel preview
          # env): presence makes the Penny spec run instead of skip.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Real OTP sign-in for EVERY authenticated spec — a fresh MailSlurp
          # inbox per test reads the actual emailed code. Specs skip if unset,
          # so without this key the run is close to a no-op.
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
          # Only needed if Vercel Deployment Protection is enabled.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run e2e

      # Traces/screenshots/videos for red specs — without this the failure
      # context is unrecoverable once the runner is gone.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
