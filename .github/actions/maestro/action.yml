# Maestro, restored from cache or installed, at the pinned version, on PATH.
#
# Two callers, one key: ci.yml's iOS shards, and ios-app-cache.yml on `main`.
# The same reason as ios-sim-app: a cache a `pull_request` run saves is visible
# to that PR alone, so until `main` saved one, four of five shards on #109's
# run reinstalled Maestro from the internet (2.7-3.0 min each) instead of
# restoring it (~1 min). The version is an INPUT, not a pin here: ci.yml's
# shard env is where it pairs with the Xcode the shards select, and
# iosAppCacheGuard.test.ts holds every copy of the pin equal.
name: Maestro
description: Restore or install Maestro at a pinned version and put it on PATH.

inputs:
  version:
    description: Maestro release, e.g. 2.10.0 — the installer and the cache key both read it.
    required: true

runs:
  using: composite
  steps:
    - name: Cache Maestro
      uses: actions/cache@v4
      with:
        path: ~/.maestro
        key: maestro-${{ runner.os }}-${{ inputs.version }}

    # The installer reads MAESTRO_VERSION; a key that disagreed with it would
    # serve a different Maestro, whose driver/Xcode mismatch presents as a
    # timeout naming no version.
    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -x "$HOME/.maestro/bin/maestro" ]; then
          echo "Maestro restored from cache"
        else
          curl -Ls https://get.maestro.mobile.dev | bash
        fi
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        "$HOME/.maestro/bin/maestro" --version
