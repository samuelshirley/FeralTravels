# Sign in, the way a person does: type the address, read the code, type the code.
#
# EMAIL is minted by scripts/ios-e2e-fixture.mjs against the same deployment
# this build points at. The address is a `playwright-*@e2e.feraltravels.com`
# fixture — `e2e.` has no MX record, so it can never belong to a person.
#
# The CODE is NOT passed in. It is read by read-otp.js after the app's own send,
# because a code minted before the run is deleted by that send once the 60s
# resend cooldown has lapsed — which is exactly what happened in CI, where
# launch.yaml runs first and takes 53 seconds.
# SUBFLOW. Not a standalone flow, and running it as one alongside
# chat-keyboard.yaml BREAKS BOTH: `verifyOtpCode` deletes the row on success
# (src/server/auth/otp.ts:103), so the code is spent by whichever runs first and
# the second sign-in fails on a code that no longer exists. The workflow
# therefore names chat-keyboard.yaml explicitly rather than pointing Maestro at
# this directory. One account, one code, one sign-in.
appId: ${APP_ID}
---
# THE KEYCHAIN IS NOT APP DATA, and `clearState` does not touch it. On iOS a
# keychain item outlives the app that wrote it — uninstall included — so once
# the build was signed well enough to actually store a session token, every
# subsequent run launched straight into /trips and this flow asserted on a
# sign-in screen that was never going to appear.
#
# It only looked fine while the app was built with CODE_SIGNING_ALLOWED=NO,
# because nothing could be written in the first place. Fixing the build is what
# exposed this, which is the usual shape: one broken thing hiding another.
- clearKeychain
- launchApp:
    # A fresh install every run. Without this the keychain still holds the
    # previous run's session token and the app lands on /trips, so the sign-in
    # flow silently asserts nothing.
    clearState: true
    permissions:
      # Location is asked AT LAUNCH, on the splash (primer -> iOS dialog), and
      # launch waits for the answer. Pre-set to DENIED so that question is
      # already settled and no flow that runs this one meets the primer; the
      # location-primer-* flows are the ones that answer it themselves.
      # `never`, not `deny`. Maestro validates this per-permission, and
      # `location` is the special case: it takes always/inuse/never/
      # location-always, while allow/deny/unset belong to 'all'. `deny`
      # here is not ignored — it aborts the flow on its FIRST command
      # with `wrong argument value`, which is what made layer 1 red
      # before the app was even asked to render anything.
      location: never

# The same guard launch.yaml carries, and for the same reason: this flow is
# `runFlow`ed by chat-keyboard, screenshots and settings-location, so one
# assertion here makes a server error name itself in all four.
- assertNotVisible:
    id: 'fatal-error-modal'

# A cleared keychain is a fresh install as far as the app can tell, so the
# first-launch intro comes first. Here, in the subflow, so the ~30 flows that
# sign in through it all walk the real fresh-install path.
- runFlow: intro-have-account.yaml

- extendedWaitUntil:
    visible:
      id: 'signin-email'
    timeout: 30000

# Guideline 5.1.1(i): the privacy policy is reachable before an account exists.
# Here, in the subflow, so every flow that signs in proves it — not tapped,
# because both open Safari and leave the app (legalPagesGuard.test.ts checks
# where they point).
- assertVisible:
    id: 'signin-privacy-link'
- assertVisible:
    id: 'signin-terms-link'

# The address, the emailed code, the six boxes: sign-in-otp.yaml, shared with
# intro-create-trip.yaml, which reaches this screen through the intro's
# "Create trip" instead.
- runFlow: sign-in-otp.yaml

# NO `tapOn: 'Verify code'`, and its absence is the app's behaviour, not a gap.
#
# The screen submits itself the instant the sixth digit lands — the same path an
# autofill takes, where the user never touches the button — and the label
# becomes "Verifying…" while it does. So there is no reachable moment when a
# complete code and a button reading "Verify code" exist together; tapping it
# used to "work" only because a digit was missing, which left the form
# incomplete and the button inert. The assertion below is what proves the
# submit happened.

# Landed. The seeded trip is the proof the session is real and the API answered
# with this user's own data, not a cached shell.
#
# A REGEX, because Maestro matches a text selector against the WHOLE label and
# the card is a single accessibility element reading
# "E2E Fixture Trip, 2026-09-15 → 2026-09-16" — the name, the dates and the
# separator merged by TripCard. The bare name matched nothing, which is how a
# completed, working sign-in still reported as a failure. The dates come from
# the fixture seed and would make this brittle if they were spelled out here.
#
# ${TRIP_NAME} rather than the literal, because screenshots.yaml seeds the same
# canonical graph under a name a customer could read — "E2E Fixture Trip" is
# the right name for a test and the wrong one for the App Store. Every other
# caller passes the default, so this asserts exactly what it always did.
- extendedWaitUntil:
    visible:
      text: '.*${TRIP_NAME}.*'
    timeout: 30000
