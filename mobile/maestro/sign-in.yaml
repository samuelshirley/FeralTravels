# Sign in, the way a person does: type the address, read the code, type the code.
#
# EMAIL and CODE are minted by scripts/ios-e2e-fixture.mjs against the same
# preview this build points at. The address is a `playwright-*@e2e.feraltravels.com`
# fixture — `e2e.` has no MX record, so it can never belong to a person.
# SUBFLOW. Not a standalone flow, and running it as one alongside
# chat-keyboard.yaml BREAKS BOTH: `verifyOtpCode` deletes the row on success
# (src/server/auth/otp.ts:103), so the code is spent by whichever runs first and
# the second sign-in fails on a code that no longer exists. The workflow
# therefore names chat-keyboard.yaml explicitly rather than pointing Maestro at
# this directory. One account, one code, one sign-in.
appId: ${APP_ID}
---
- launchApp:
    # A fresh install every run. Without this the keychain still holds the
    # previous run's session token and the app lands on /trips, so the sign-in
    # flow silently asserts nothing.
    clearState: true
    permissions:
      # Location is asked for on the trip screen. Left DENIED on purpose: the
      # chat flow must not depend on a permission dialog it did not open, and a
      # granted-location app pops the primer over the composer.
      location: deny

- extendedWaitUntil:
    visible:
      id: 'signin-email'
    timeout: 30000

- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
- hideKeyboard

- tapOn: 'Email me a code'

# The verify screen. The first box autofocuses and its maxLength is the full
# code length, so iOS spreads a six-digit string across all six boxes — which
# is the same path an SMS/keychain autofill takes.
- extendedWaitUntil:
    visible: 'Enter your code'
    timeout: 30000
- tapOn:
    id: 'signin-code-0'
- inputText: ${CODE}

- tapOn: 'Verify code'

# Landed. The seeded trip is the proof the session is real and the API answered
# with this user's own data, not a cached shell.
- extendedWaitUntil:
    visible:
      text: 'E2E Fixture Trip'
    timeout: 30000
