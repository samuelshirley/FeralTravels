# The paywall SCREEN (app/paywall.tsx): a blocked account with no trips of its
# own is sent there at launch instead of to an empty list. paywall.yaml covers
# a blocked account that HAS trips (Penny's bubble); nothing reached this
# screen before. Also holds the screen's ways out (2026-10-20, Guidelines
# 5.1.1(v) and 2.1): pull-to-refresh and the Account settings link.
#
# The trip is deleted through the UI while the account is still entitled
# (seed-account.js refuses an account that owns nothing, and sign-in waits for
# a trip card), then the account is blocked and the app relaunched.
#
# UNPROVEN: written from the source (2026-10-07) by a session that could not
# reach a simulator. Run it locally before trusting a green or a red.
#
# Its own account (suffix `pn`).
appId: ${APP_ID}
---
- runScript:
    file: seed-account.js
    env:
      ACCOUNT_SUFFIX: pn
      SEED_CANONICAL: '1'
      FORCED_FUEL_STOP: ''
      RANGE_KM: ''
      JEV_MODE: ''
      EXTRA_TRIP_KIND: ''
      EXTRA_TRIP_NAME: ''

- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${output.account.email}
      TRIP_NAME: ${output.account.tripName}

# ── Delete the only trip ────────────────────────────────────────────────────
- tapOn: 'EDIT TRIPS'
- tapOn:
    id: 'trip-delete-${output.account.tripId}'
- extendedWaitUntil:
    visible: 'Delete trip?'
    timeout: 10000
- tapOn:
    id: 'trip-delete-confirm'
- extendedWaitUntil:
    notVisible: 'Delete trip?'
    timeout: 20000

# ── Blocked, relaunched: the paywall screen, not the list ──────────────────
- runScript:
    file: set-subscription.js
    env:
      ACCOUNT_EMAIL: ${output.account.email}
      COMPED: '0'
      CREATED_DAYS_AGO: '7'
      SUBSCRIPTION_STATUS: ''
      SUBSCRIPTION_SOURCE: ''
- stopApp
- launchApp
# The typing bubble runs ~3 s before Penny's message appears.
- extendedWaitUntil:
    visible:
      text: ".*That.s your seven days up.*"
    timeout: 30000
- assertVisible:
    id: 'paywall-cta'
    text: 'Keep planning'
- assertNotVisible: '+ New trip'
- assertNotVisible:
    id: 'chat-composer-input'

# ── Pull-to-refresh is real (the failure copy tells people to pull) ────────
# A pull re-fetches the entitlement; the account is still blocked, so the same
# message and CTA come back rather than a blank or stuck screen.
- swipe:
    direction: DOWN
- extendedWaitUntil:
    visible:
      text: ".*That.s your seven days up.*"
    timeout: 30000
- assertVisible:
    id: 'paywall-cta'
    text: 'Keep planning'

# ── Its sheet: the same full disclosure as every purchase surface ──────────
- tapOn:
    id: 'paywall-cta'
- runFlow: purchase-sheet.yaml
- tapOn: 'Close'

# ── No dead end: Account settings is on this screen (sign-out, deletion) ───
# NOT driven here: the "Try again" CTA, which only appears when the
# entitlement fetch FAILS — nothing in the fixture API can make it fail for one
# account. paywallDeadEndGuard.test.ts holds that branch.
- assertVisible:
    id: 'paywall-account-settings'
    text: 'Account settings'
- tapOn:
    id: 'paywall-account-settings'
- extendedWaitUntil:
    visible: 'Vehicle profile'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'delete-account-open'
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: 'delete-account-open'
