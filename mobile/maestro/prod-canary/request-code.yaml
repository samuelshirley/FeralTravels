# Production canary, part 1 of 2: a fresh install asks production for a code.
# See README.md here. The code is NOT read by a script (no /api/test/* on
# production); the runner waits for it between this flow and plan-trip.yaml.
appId: ${APP_ID}
---
# Same reasons as sign-in.yaml: a keychain item outlives clearState, and a
# granted-location app pops the primer over the composer.
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      location: never

- assertNotVisible:
    id: 'fatal-error-modal'
- extendedWaitUntil:
    visible:
      id: 'signin-email'
    timeout: 60000
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}
# No hideKeyboard — see sign-in.yaml; the button is clear of the keyboard.
- tapOn: 'Email me a 6-digit code'
- extendedWaitUntil:
    visible: 'Check your email'
    timeout: 30000
- assertNotVisible:
    id: 'fatal-error-modal'
