# Vehicles in Settings: the only vehicle cannot be deleted and the screen says
# why; adding a second makes both deletable, and it is still there after a
# relaunch. The screen half of e2e/vehicle-crud.spec.ts.
#
# Its own account (suffix `veh`): the vehicle count is the assertion, and the
# shard's account gains vehicles from other flows.
appId: ${APP_ID}
---
- runScript:
    file: seed-account.js
    env:
      ACCOUNT_SUFFIX: veh
      SEED_CANONICAL: '1'
      FORCED_FUEL_STOP: ''
      RANGE_KM: ''
      EXTRA_TRIP_KIND: ''
      EXTRA_TRIP_NAME: ''

- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${output.account.email}
      TRIP_NAME: ${output.account.tripName}

- tapOn: 'Account menu.*'
- tapOn:
    id: 'account-menu-settings'
- extendedWaitUntil:
    visible: 'Vehicle profile'
    timeout: 20000

# ── One vehicle: kept, and the screen says so ───────────────────────────────
- scrollUntilVisible:
    element:
      text: "This is your only vehicle, so it can.t be deleted.*"
    direction: DOWN
    timeout: 20000
- assertVisible: 'E2E Fixture Van'
- assertNotVisible: 'Delete'

# ── Add a second ────────────────────────────────────────────────────────────
- tapOn: '+ Add vehicle'
- extendedWaitUntil:
    visible: 'DRIVING LIMITS'
    timeout: 10000
# The INPUT, not its question: the question Text reads the same with " *" on
# the end, and tapping that focuses nothing (the first run typed the name into
# thin air and Save said "name is required").
- tapOn:
    text: "What.s the vehicle called\\? \\(just a nickname is fine\\)"
- inputText: 'Test Van'
# Return leaves the name field. Tapping straight to the range field did not
# move focus on the first run — "400" landed in the name ("Test Van400").
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: "What.s your driving range on a tank, in kilometers\\?"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "What.s your driving range on a tank, in kilometers\\?"
- inputText: '400'
- scrollUntilVisible:
    element: 'Save'
    direction: DOWN
    timeout: 10000
- tapOn: 'Save'
- extendedWaitUntil:
    visible: 'Test Van'
    timeout: 20000
- assertVisible: 'REFILL EVERY ~400 km'
- assertNotVisible:
    text: "This is your only vehicle.*"
- assertVisible:
    text: 'Delete'
    index: 1

# ── Stored ──────────────────────────────────────────────────────────────────
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      text: '.*${output.account.tripName}.*'
    timeout: 30000
- tapOn: 'Account menu.*'
- tapOn:
    id: 'account-menu-settings'
- scrollUntilVisible:
    element: 'Test Van'
    direction: DOWN
    timeout: 20000
