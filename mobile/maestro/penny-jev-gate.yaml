# Jev is asked, and Penny answers. The ONE place CI calls Jev (TypeSafe's
# hosted jev-1.13.0): one fresh fixture account, three synthetic messages, on
# the PR's preview, whose Vercel Preview environment carries JEV_BASE_URL,
# JEV_API_KEY and JEV_MODEL. Production has no JEV_*. Runs only in the `ai`
# shard, on a run started by the `ai-tests` label. Sam chose this on
# 2026-10-02 (ticket tkt_oym0o6flee); docs/design/jev.md is the gate it tests.
#
# A preview's global switch (`app_meta.jev_mode`) is cloned from production,
# where it is off, so the account is seeded with its own override
# (`users.jev_mode = 'on'`, Jev first). No other account on the preview
# reaches Jev.
#
# THE MESSAGES ARE CHOSEN SO THE FREE RULES CANNOT SETTLE THEM. Both other AI
# flows passed locally with Jev first on and Jev never called: every message
# named a place or used trip vocabulary, so `decideDeterministically`
# (src/lib/pennyGate.ts) let it through before the classifier. These three
# name nothing on the trip and use none of TRIP_VOCABULARY, so each one goes
# to Jev, and to Haiku only when Jev is not confident of a T1. Locally Jev
# settled "can we leave a day later" T1 at 0.99 in 225 ms. "yes do that" and
# "undo that" are bare replies, the kind the gate cannot read without Penny's
# previous answer, which it is not given.
#
# What it proves, per message, from the server's ledger (check-jev-gate.js)
# and then the screen: the classifier decided it, not a free rule; Jev was
# asked and answered; the gate said T1; and Penny answered, with neither
# gate line on screen. At the end, at least one message was settled by Jev
# itself. A flow that only watched the screen would pass with Jev unplugged.
#
# Cost: up to three Penny turns on the canonical trip, up to three Haiku gate
# calls (only where Jev defers), and three Jev calls (~$0.00004 each).
appId: ${APP_ID}
---
- runScript:
    file: seed-account.js
    env:
      ACCOUNT_SUFFIX: jev
      SEED_CANONICAL: '1'
      FORCED_FUEL_STOP: ''
      RANGE_KM: ''
      JEV_MODE: 'on'
      EXTRA_TRIP_KIND: ''
      EXTRA_TRIP_NAME: ''

- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${output.account.email}
      TRIP_NAME: ${output.account.tripName}

# A planned trip opens on its days; the chat is one tab over.
- tapOn:
    text: '.*${output.account.tripName}.*'
- tapOn: 'CHAT'
- extendedWaitUntil:
    visible:
      id: 'chat-composer'
    timeout: 30000

# ── 1: an off-rule request ──────────────────────────────────────────────────
- tapOn:
    id: 'chat-composer-input'
- inputText: 'can we leave a day later'
- tapOn:
    id: 'chat-composer-send'
- extendedWaitUntil:
    visible: 'Read'
    timeout: 30000
# Keyboard down before waiting out the turn; the same dance as penny-plan-trip
# (a tap during a fast reply's scroll only stops the scroll; not the left
# edge, which is iOS's back-swipe zone).
- waitForAnimationToEnd
- tapOn:
    point: '50%,30%'
- runFlow:
    when:
      notVisible: 'CHAT'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: '50%,30%'
- extendedWaitUntil:
    visible: 'CHAT'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'penny-status'
      text: 'READY'
    timeout: 240000
# The ledger first: on a refusal it says who refused and Jev's numbers, which
# the screen cannot.
- runScript:
    file: check-jev-gate.js
    env:
      ACCOUNT_EMAIL: ${output.account.email}
      MESSAGE_NO: '1'
      MESSAGE_LABEL: 'can we leave a day later'
      EXPECT_SETTLED: ''
- assertNotVisible:
    text: '.*I only work on your trip.*'
- assertNotVisible:
    text: ".*I can't check that, but I can plan around it.*"
- assertNotVisible:
    text: '^Error: .*'

# ── 2: a bare yes ───────────────────────────────────────────────────────────
- tapOn:
    id: 'chat-composer-input'
- inputText: 'yes do that'
- tapOn:
    id: 'chat-composer-send'
- extendedWaitUntil:
    visible: 'Read'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: '50%,30%'
- runFlow:
    when:
      notVisible: 'CHAT'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: '50%,30%'
- extendedWaitUntil:
    visible: 'CHAT'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'penny-status'
      text: 'READY'
    timeout: 240000
- runScript:
    file: check-jev-gate.js
    env:
      ACCOUNT_EMAIL: ${output.account.email}
      MESSAGE_NO: '2'
      MESSAGE_LABEL: 'yes do that'
      EXPECT_SETTLED: ''
- assertNotVisible:
    text: '.*I only work on your trip.*'
- assertNotVisible:
    text: ".*I can't check that, but I can plan around it.*"
- assertNotVisible:
    text: '^Error: .*'

# ── 3: a bare undo ──────────────────────────────────────────────────────────
- tapOn:
    id: 'chat-composer-input'
- inputText: 'undo that'
- tapOn:
    id: 'chat-composer-send'
- extendedWaitUntil:
    visible: 'Read'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    point: '50%,30%'
- runFlow:
    when:
      notVisible: 'CHAT'
    commands:
      - waitForAnimationToEnd
      - tapOn:
          point: '50%,30%'
- extendedWaitUntil:
    visible: 'CHAT'
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: 'penny-status'
      text: 'READY'
    timeout: 240000
- runScript:
    file: check-jev-gate.js
    env:
      ACCOUNT_EMAIL: ${output.account.email}
      MESSAGE_NO: '3'
      MESSAGE_LABEL: 'undo that'
      EXPECT_SETTLED: '1'
- assertNotVisible:
    text: '.*I only work on your trip.*'
- assertNotVisible:
    text: ".*I can't check that, but I can plan around it.*"
- assertNotVisible:
    text: '^Error: .*'
