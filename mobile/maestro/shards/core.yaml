# Shard `core`: sign-in, chat, location. One Maestro run on its own simulator
# and its own fixture account (see the ios-e2e job in ci.yml).
#
# REBALANCED 2026-11-13: this was the longest shard (15:17 of flows on run
# 43406725075, every other shard 9:18-13:32), so it set the run's length.
# onboarding-flash and onboarding-date-picker moved to `settings.yaml`, which
# was the shortest; both sign in to that shard's own fixture account.
#
# ORDER MATTERS, and flowsOrder is what enforces it:
#   - the two location-primer flows run FIRST: each launches with the location
#     permission unset and answers the launch dialog itself; every later flow
#     relaunches with `location: never`.
#   - settings-location runs LAST: it spends the location dialog for the
#     install, and `canAskAgain` does not come back. It also DENIES at the end —
#     granting would let report_position re-anchor the fixture trip.
#   - chat-tab-in-flight only ADDS to the account (a planted turn), so it
#     tolerates running after anything.
#
# `flows:` and `flowsOrder` must name the same set; src/lib/maestroFlowParams.test.ts
# checks that, and that every flow in mobile/maestro/ belongs to exactly one shard.
flows:
  - location-primer-allow.yaml
  - location-primer-deny.yaml
  - chat-keyboard.yaml
  - chat-tab-in-flight.yaml
  - chat-attach-photo.yaml
  - settings-location.yaml
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - location-primer-allow
    - location-primer-deny
    - chat-keyboard
    - chat-tab-in-flight
    - chat-attach-photo
    - settings-location
