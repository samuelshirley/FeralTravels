# A stop on a BASE day is listed on that day (#67).
#
# The bug (2026-09-26): "Add this overnight location for my stop in Lisbon" put
# the stop on a rest day — `leg_type: 'rest'`, a day spent in one city — and it
# was saved and drawn on the map but never listed in the itinerary, on web or
# iOS, because both LegCards rendered StopsSection only in the drive branch.
# #67 fixed it with tsc and a source-text guard; this is the device proof.
#
# seed-rest-day-stop.js seeds the canonical 12-leg trip and puts the real Maps
# share link on its first Lisbon base day through Penny's own add_stop path
# server-side (no model). The flow then opens THAT day and asserts the stop is
# listed, with its Maps link, and that a base day still shows no fuel UI.
#
# No paid call: a base day never sources fuel, and the canonical trip's sourced
# legs are stamped fresh. The share link is resolved live (a free redirect walk).
appId: ${APP_ID}
---
- runScript: seed-rest-day-stop.js

- runFlow: sign-in.yaml

- tapOn:
    text: '.*${output.tripName}.*'
- extendedWaitUntil:
    visible: 'LIST'
    timeout: 30000
- tapOn: 'LIST'

- scrollUntilVisible:
    element:
      id: 'leg-card-${output.legId}'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'leg-card-${output.legId}'

# The base day's own sections, then its stop.
- scrollUntilVisible:
    element: 'LOCATION'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'STOP: .*Pra.a do Com.rcio.*Opens in Google Maps'
    direction: DOWN
    timeout: 20000
- assertVisible:
    text: 'Remove .*Pra.a do Com.rcio.*'
- assertVisible: '+ Add to this day'

# A base day has no drive, so nothing about fuel may appear on it.
- assertNotVisible: 'Planning fuel stops…'
- assertNotVisible:
    text: 'No fuel stop needed.*'
- assertNotVisible:
    text: 'No stops yet.*'
- assertNotVisible:
    text: '.*NAVIGATE.*'
