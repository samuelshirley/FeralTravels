# SUBFLOW. The email-and-code half of sign-in, from the sign-in screen to a
# submitted code. Moved out of sign-in.yaml unchanged (2026-11-02) so the
# intro's "Create trip" path signs in exactly the way every other flow does;
# the long notes on why each step is shaped the way it is stay with the steps.
#
# Starts on the sign-in screen with `signin-email` visible. Ends the moment the
# sixth digit lands (the screen submits itself) — the CALLER asserts where
# sign-in went, because that differs: the trips list for sign-in.yaml, a new
# trip's chat for intro-create-trip.yaml.
appId: ${APP_ID}
---
- tapOn:
    id: 'signin-email'
- inputText: ${EMAIL}

# NO `hideKeyboard` HERE, and it is not an omission.
#
# It was the step that made this flow red, and it could never have worked: on
# iOS Maestro dismisses the keyboard by finding a standard return/done action,
# and this field is `returnKeyType="send"`, so there is none — the command fails
# with "Couldn't hide the keyboard. This can happen if the app uses a custom
# input or doesn't expose a standard dismiss action."
#
# It was also unnecessary. On an iPhone 17 Pro the button's bounds are
# [41,463][361,505] and the keyboard's inputView starts at y=566, so it is
# fully clear of it and the tap below lands on the button. Read off the live
# hierarchy, not assumed. If a smaller device ever puts the two in contact the
# fix is to scroll the button into view, not to reinstate this.
#
# THE SEND IS RETRIED ONCE, and this is the one place a Maestro `retry:` can
# work. Twice (2026-11-03 paywall-no-trips, 2026-11-13 support-form) the send
# never came back and "Check your email" never appeared; the app's request had
# no timeout, so the spinner ran for good. lib/api.ts now gives up after 20s
# and shows an error with the button live again, so a second tap is the same
# thing a person would do. A failed `extendedWaitUntil` is a MaestroException,
# which `retry` catches (unlike the launch failure sign-in.yaml cannot retry).
#
# The tap is `optional` so a send that answered LATE — the code screen is up
# by the time the retry starts — falls straight through to the wait instead of
# failing on a button that is gone. A missing button on the first attempt
# still fails: the wait below never sees "Check your email". A second tap
# inside the server's 60s cooldown answers 429, which the app shows as the
# code screen ("We already sent you a code"), so the retry lands there too.
# Its possible extra code is the reserve maestroOtpBudget.test.ts keeps per
# shard.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          text: 'Email me a 6-digit code'
          optional: true
      - extendedWaitUntil:
          visible: 'Check your email'
          timeout: 30000

# The verify screen.
#
# ONE DIGIT PER BOX, each box focused deliberately. The original single
# `inputText: ${CODE}` into box 0 assumed iOS would deliver the whole string at
# once and hit the app's paste/autofill branch, which spreads it across all six.
# Maestro does not paste — XCTest TYPES, character by character — so it went
# down the per-character path instead and lost a digit every run, landing five
# in six boxes (observed: 8 0 8 8 8 _).
#
# The loss is a race the app cannot see: each keystroke sets a box and calls
# `focus()` on the next one ASYNCHRONOUSLY, while every box carries
# `selectTextOnFocus`. A character arriving before that focus lands hits the
# previous box with its text still selected and REPLACES it rather than
# appending, so the digit vanishes with no error anywhere. A person types far
# too slowly to reach it, and a real paste or an iOS one-time-code autofill goes
# down the spread branch and is unaffected — which is why this is fixed here
# rather than in the app. (Reaching it is the retry block above.)

# Read the code NOW, not before the run. The app only reaches this screen once
# its own send has resolved, and that send may well have REPLACED the code a
# fixture minted earlier — `storeOtpCode` keeps exactly one code per address and
# the 60s resend cooldown decides which one survives. read-otp.js has the full
# story; it is the fix for the only failure CI had left.
- runScript: read-otp.js

- tapOn:
    id: 'signin-code-0'
- inputText: ${output.code.charAt(0)}
- tapOn:
    id: 'signin-code-1'
- inputText: ${output.code.charAt(1)}
- tapOn:
    id: 'signin-code-2'
- inputText: ${output.code.charAt(2)}
- tapOn:
    id: 'signin-code-3'
- inputText: ${output.code.charAt(3)}
- tapOn:
    id: 'signin-code-4'
- inputText: ${output.code.charAt(4)}
- tapOn:
    id: 'signin-code-5'
- inputText: ${output.code.charAt(5)}
